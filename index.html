:root{
  --wood:#c9853e; --wood-d:#8a5528; --wood-dd:#5c3416; --paper:#fbe6b5; --paper2:#f3d595; --paper3:#e9c48a;
  --ink:#3b2412; --ink-soft:#7a5230; --accent:#e2574c; --green:#4f9a3a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"FusionPixel","Noto Sans SC",monospace;color:var(--ink);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:none;font-smooth:never;padding:64px 12px 40px;background:#78c6f0}
#bg{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;image-rendering:pixelated;z-index:0}
img,svg,canvas{image-rendering:pixelated}

/* 顶栏 */
#hud{position:fixed;top:10px;right:10px;z-index:5;display:flex;gap:8px}
.hudbtn{font:inherit;font-size:14px;cursor:pointer;color:#fff8e6;background:var(--wood-dd);border:none;padding:6px 10px;
  box-shadow:0 -3px 0 0 var(--wood-dd),0 3px 0 0 var(--wood-dd),-3px 0 0 0 var(--wood-dd),3px 0 0 0 var(--wood-dd),inset 0 -3px 0 rgba(0,0,0,.25)}
.hudbtn.on{background:var(--green)}
.hudbtn .cur{color:#fff8e6}.hudbtn .dim{color:#c9a27a}

/* 木框面板：像素缺角 */
.wrap{position:relative;z-index:1;max-width:700px;margin:0 auto}
.frame{filter:drop-shadow(0 6px 0 rgba(60,30,10,.45))}
.panel{position:relative;background:var(--paper);padding:30px 26px 26px;
  clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
  box-shadow:inset 0 0 0 4px var(--wood-dd),inset 0 0 0 8px var(--wood),inset 0 0 0 12px var(--wood-d),inset 0 0 0 14px var(--paper3)}
.foot{position:relative;z-index:1;text-align:center;font-size:12px;color:#fff8e6;margin-top:16px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}

/* 文字 */
.center{text-align:center}
.muted{color:var(--ink-soft);font-size:14px}
.h2{font-size:26px;text-align:center;margin:4px 0 4px;color:var(--wood-dd);font-weight:400}
.logo{text-align:center;margin:4px 0 18px}
.logo-big{display:block;font-size:36px;line-height:1.2;color:#fff8e6;letter-spacing:2px;
  text-shadow:3px 0 0 var(--wood-dd),-3px 0 0 var(--wood-dd),0 3px 0 var(--wood-dd),0 -3px 0 var(--wood-dd),3px 3px 0 var(--wood-dd),-3px 3px 0 var(--wood-dd),3px -3px 0 var(--wood-dd),-3px -3px 0 var(--wood-dd),0 7px 0 #3a1f0c}
.logo-sub{display:inline-block;margin-top:12px;background:var(--green);color:#fff8e6;padding:4px 12px;font-size:16px;box-shadow:0 4px 0 #2f6a22}
.letter{background:#fff8e6;padding:18px 20px;margin:0 0 22px;position:relative;

    zh:{name:"海莉",title:"镜头后的小公主",desc:"爱时尚、爱拍照，刚认识时有点挑剔和骄傲。熟了以后会发现她很在意别人，也在慢慢学着关心身边的人和事。",home:"柳树巷2号，和姐姐艾米丽同住",routine:"上午在房间，中午去社区中心西边的喷泉，下午四点半回家做晚饭。夏天去海滩，周一和秋天去玛妮牧场南边的河边拍照，下雨天不出门。",hobby:"摄影（家里有自己的暗房）、买衣服、晒太阳、做饭",events:[["2心","调解她和艾米丽为沙发垫吵架"],["4心","请你帮忙拧开一个罐子"],["6心","在海滩弄丢曾祖母的手镯，你帮她找回来"],["8心","在牧场拍照，她想骑牛结果弄得一身泥"],["10心","带你看她的暗房"],["14心","为学校买新书办慈善蛋糕义卖"]],why:"她需要一个能看到她骄傲外壳下面那一面的人，而你恰好有耐心。",gifts:"椰子、向日葵、粉红蛋糕、水果沙拉"},

  leah:{spouse:"F",color:"#5f9b4c",icon:"leaf",bd:["wi",23],mbti:"ISFP",mbtiSrc:"pt",p:{soc:-1,art:2,sci:-1,adv:0,nat:2,care:1,edge:0,amb:0,home:1},
    zh:{name:"莉亚",title:"林间艺术家",desc:"离开城市和前任，一个人搬到乡下当艺术家，靠雕刻和画画生活。",home:"煤矿森林里的莉亚小屋",routine:"每天早上在小屋做雕塑，然后去森林池塘和码头散步。下雨天和周五、周六下午常去酒吧，有时去海滩画画。",hobby:"雕塑、画画、采野菜、找蘑菇、木工、做沙拉",events:[["2心","聊雕塑，你可以建议她办展或在网上卖作品"],["4心","前任打来电话，她问你离开城市当艺术家是不是很自私"],["6心","送你一座名叫“我对你的感觉”的雕塑"],["8心","按你之前的建议，办了画展或开了网店"],["10心","森林野餐时，前任凯尔突然出现"],["14心","和她一起在森林里给玛妮画像"]],why:"你们都更愿意待在安静的地方做自己喜欢的事，她会是最懂你独处需求的人。",gifts:"山羊奶酪、沙拉、松露、罂粟籽松饼"},
    en:{name:"Leah",title:"The artist in the woods",desc:"She left the city and her ex behind to become an artist in the countryside, living off her sculptures and paintings.",home:"Leah's Cottage in Cindersap Forest",routine:"Sculpts every morning, then walks to the forest pond and the pier. On rainy days and Friday/Saturday afternoons she often heads to the Saloon. Sometimes paints at the beach.",hobby:"Sculpting, painting, foraging, mushroom hunting, woodworking, salads",events:[["2♥","Talk sculpture: suggest an art show or selling online"],["4♥","After a call from her ex, she asks if moving here was selfish"],["6♥","She leaves you a sculpture called \"How I Feel About You\""],["8♥","Her art show, or her online shop, takes off"],["10♥","Her ex Kel crashes your forest picnic"],["14♥","Paint a portrait of Marnie together in the forest"]],why:"You'd both rather be somewhere quiet doing what you love. She'll understand your need for space better than anyone.",gifts:"Goat cheese, salad, truffle, poppyseed muffin"}},

    zh:{name:"玛鲁",title:"发明家护士",desc:"聪明能干，白天在诊所当护士，回家就在房间里造机器、组装望远镜。",home:"山路24号，和父母罗宾、德米特里厄斯以及同母异父的哥哥塞巴斯蒂安同住",routine:"周二、周四在哈维的诊所上班，四点四十下班回家。常和潘妮坐在酒吧南边的长椅上。",hobby:"造机器、用望远镜看星星、读《原理图周刊》、记录夏天的昆虫",events:[["心事件","一起用她的望远镜看星星"],["心事件","一场电到人的机器演示"],["心事件","她造的机器人飞向了太空"],["14心","在山上一起看彗星、许愿"]],why:"她既能陪你研究新东西，又会在你累倒的时候第一个发现。",gifts:"电池组、钻石、草莓、金锭"},
    en:{name:"Maru",title:"The inventor nurse",desc:"Smart and capable. She's a nurse at the clinic by day and builds machines and telescopes in her room at night.",home:"24 Mountain Road, with her parents Robin and Demetrius and her half-brother Sebastian",routine:"Works at Harvey's clinic on Tuesdays and Thursdays and heads home at 4:40 PM. Often sits with Penny on the bench south of the Saloon.",hobby:"Building gadgets, stargazing, reading Schematics Weekly, cataloguing summer insects",events:[["♥","Stargazing through her telescope"],["♥","A machine demo that gives you a shock"],["♥","Her robot heads off into space"],["14♥","Watch a comet and make a wish on the mountain"]],why:"She'll happily tinker with new ideas alongside you, and she'll be the first to notice when you've worn yourself out.",gifts:"Battery pack, diamond, strawberry, gold bar"}},

    zh:{name:"潘妮",title:"温柔的小老师",desc:"害羞、爱看书，负责给镇上的孩子上课，最想要的是一个安稳干净的家。",home:"镇中心东边、河西岸的拖车，和母亲潘姆同住",routine:"周二、三、五在博物馆给贾斯和文森特上课，周六带他们去游乐场。周一、四、日在墓地附近看书，和玛鲁坐在酒吧外面。",hobby:"读书、做饭（她自己承认手艺一般）、打扫、看电视",events:[["2心","帮乔治捡一封信"],["4心","帮她收拾乱糟糟的拖车"],["6心","尝她发明的新菜，之后她约你看电影"],["8心","森林郊游时你给孩子们讲话"],["10心","在温泉里向你告白"],["14心","想重新布置你们的卧室"]],why:"她会给你一个真正可以放松下来的家，你也会是她一直在等的那份安全感。",gifts:"甜瓜、罂粟籽松饼、绿宝石、钻石"},
    en:{name:"Penny",title:"The gentle teacher",desc:"Shy and bookish, she teaches the town's children. What she wants most is a calm, tidy home.",home:"The trailer east of the town square, with her mother Pam",routine:"Tutors Jas and Vincent at the museum on Tuesdays, Wednesdays and Fridays, and takes them to the playground on Saturdays. Other days she reads near the graveyard and sits with Maru outside the Saloon.",hobby:"Reading, cooking (she admits she's not great at it), cleaning, TV",events:[["2♥","Fetch a letter for George"],["4♥","Help tidy up the messy trailer"],["6♥","Taste her new recipe, then she asks you to a movie"],["8♥","Talk to the kids on a forest field trip"],["10♥","She confesses her feelings at the spa"],["14♥","She wants to redecorate your bedroom"]],why:"She'll give you a home where you can truly relax, and you'll be the security she's been waiting for.",gifts:"Melon, poppyseed muffin, emerald, diamond"}},

    zh:{name:"亚历克斯",title:"球场上的大男孩",desc:"梦想成为职业橄榄球运动员。表面自信甚至有点自大，其实很在意家人，也有不愿多提的童年。",home:"镇上，和爷爷乔治、奶奶艾芙琳同住",routine:"春天每天早上在家旁边的树下练球；夏天上午去海滩，下午看冰淇淋摊；冬天大多在温泉健身。",hobby:"橄榄球、去海滩、力量训练，一直想多读点书",events:[["4心","在狗舍旁说起父亲和去世的母亲"],["5心","承认没读完书让他觉得自己没用"],["6心","怀疑自己的职业梦想，为之前的傲慢道歉"],["8心","母亲忌日那天，在海边打开她留下的音乐盒"],["10心","在酒吧包场吃晚饭，向你告白"],["14心","在酒吧弄了一间看球室"]],why:"他需要一个让他放下“酷”的样子、可以说真心话的人。",gifts:"全套早餐、三文鱼晚餐"},
    en:{name:"Alex",title:"The big kid on the field",desc:"Dreams of going pro in gridball. Confident to the point of cocky on the surface, but he cares a lot about his family and has a childhood he'd rather not talk about.",home:"In town, with his grandparents George and Evelyn",routine:"Spring mornings: practising with his gridball by the tree next to the house. Summer: the beach in the morning, the ice cream stand in the afternoon. Winter: working out at the spa.",hobby:"Gridball, the beach, strength training, and he keeps meaning to read more",events:[["4♥","By the dog pen he opens up about his parents"],["5♥","He admits not reading his books makes him feel worthless"],["6♥","He doubts his pro career and apologises for his arrogance"],["8♥","On his mother's anniversary he plays her music box at the beach"],["10♥","A private dinner at the Saloon and a confession"],["14♥","He builds a gridball viewing room at the Saloon"]],why:"He needs someone he can drop the act with and just be honest.",gifts:"Complete breakfast, salmon dinner"}},

    zh:{name:"艾利欧特",title:"海边浪漫作家",desc:"一头长发，说话文绉绉，很浪漫，一心想写出一部好小说。",home:"海滩上的小屋，就在威利的鱼店旁边",routine:"大多待在小屋或河边的桥上，秋冬常去图书馆，有时去杂货店和酒吧。",hobby:"写小说、读书、看海、弹钢琴",events:[["2心","在小屋里选一个你喜欢的小说类型"],["4心","在酒吧一起举杯"],["6心","在家弹钢琴给你听"],["8心","在博物馆朗读他的小说，题材就是你当初选的那个"],["10心","邀你一起划船"]],why:"他会把你们的日常写进故事里，你也会是他小说的第一个读者。",gifts:"蟹饼、鸭毛、石榴、龙虾"},
    en:{name:"Elliott",title:"The romantic writer by the sea",desc:"Long-haired, flowery in speech and a true romantic, he's set on writing a great novel.",home:"Elliott's Cabin on the beach, next to Willy's Fish Shop",routine:"Mostly at his cabin or on the bridge by the river. The library in fall and winter, and now and then Pierre's or the Saloon.",hobby:"Writing novels, reading, gazing at the sea, playing piano",events:[["2♥","Pick your favourite novel genre at his cabin"],["4♥","A toast together at the Saloon"],["6♥","He plays piano for you at home"],["8♥","A museum reading of his novel, in the genre you picked"],["10♥","He invites you out on a rowboat"]],why:"He'll write your everyday life into his stories, and you'll be the first to read them.",gifts:"Crab cakes, duck feather, pomegranate, lobster"}},

    zh:{name:"哈维",title:"谨慎的好医生",desc:"镇上唯一的医生，温和、细心，有点胆小，会担心每个人的身体。",home:"诊所楼上的小公寓",routine:"周二、周四给村民做体检；其他日子上午看前台，下午在镇上散步锻炼。周六去博物馆，雨天傍晚去酒吧。",hobby:"读书、摆弄收音机、做模型飞机、听爵士、健身操",events:[["2心","为健康问题和乔治争执，你选一边"],["4心","在诊所给你测脉搏"],["6心","撞见他偷偷上健身操课"],["8心","用收音机联系上真正的飞行员，说出想飞的梦想"],["10心","和你一起坐热气球"],["14心","下厨给你做晚饭，还主动洗碗"]],why:"他会把你照顾得很好，而你能带他走出舒适区，去试试他不敢做的事。",gifts:"咖啡、腌菜、松露油、葡萄酒"},
    en:{name:"Harvey",title:"The careful doctor",desc:"The town's only doctor. Gentle, attentive, a little timid, and worried about everyone's health.",home:"The small apartment above the clinic",routine:"Checkups on Tuesdays and Thursdays. Other days: the front desk in the morning, walks around town in the afternoon. Saturdays: the museum. Rainy evenings: the Saloon.",hobby:"Reading, radios, model planes, jazz, dance aerobics",events:[["2♥","He argues with George about his health; you pick a side"],["4♥","He checks your pulse at the clinic"],["6♥","You catch him at a secret aerobics class"],["8♥","He reaches a real pilot on his radio and shares his dream of flying"],["10♥","A hot-air balloon ride together"],["14♥","He cooks you dinner and does the dishes"]],why:"He'll take good care of you, and you can coax him out of his comfort zone.",gifts:"Coffee, pickles, truffle oil, wine"}},

    en:{name:"Sam",title:"The skateboarding frontman",desc:"Spiky blond hair, a skateboard and a band. Always full of energy, and a good big brother to Vincent.",home:"1 Willow Lane, with his mum Jodi and brother Vincent",routine:"Works at JojaMart on Mondays and Wednesdays, practises guitar in his room most days, and plays pool at the Saloon on Fridays and weekends.",hobby:"Guitar, skateboarding, handheld games, pool",events:[["2♥","Jam with Sebastian and help pick the band's style"],["4♥","He drops an egg; you explain it to his mum"],["6♥","Lewis catches him skating on a flower box"],["8♥","He invites you to his band's show in Zuzu City"],["10♥","A confession in his room, nearly caught by his mum"],["14♥","He lands a job writing music for a kids' TV show"]],why:"Life with him is never quiet. You can rehearse together and get into a little mischief.",gifts:"Pizza, maple bar, cactus fruit, tiger's eye"}},

    zh:{name:"塞巴斯蒂安",title:"地下室程序员",desc:"不爱社交，喜欢下雨天，觉得家里人不理解他的工作，一直想离开小镇。",home:"山路24号，母亲罗宾的木匠铺地下室",routine:"睡到十点半，然后对着电脑工作；晚上在家旁边的湖边待着。周五、周六和山姆去酒吧打台球，雨天去海边码头。",hobby:"自由职业编程、电脑游戏和桌游、漫画、科幻小说、骑摩托、台球、青蛙",events:[["2心","聊自己做自由职业程序员不被理解"],["4心","在修摩托，说以后带你兜风"],["6心","和山姆一起在他房间玩桌游"],["8心","雨天海边，承认自己在人群里会焦虑，和你共撑一把伞"],["10心","骑摩托带你去看风景，向你告白"],["14心","雨天一起救了一只受伤的青蛙"]],why:"他不需要很多人，只需要一个真正懂他的人，在雨天陪他坐在码头。",gifts:"冰封泪珠、黑曜石、生鱼片、南瓜汤"},
    en:{name:"Sebastian",title:"The programmer in the basement",desc:"Not one for crowds, loves rainy days, feels his family doesn't get his work, and has long wanted to leave town.",home:"24 Mountain Road, in the basement of his mother Robin's carpenter shop",routine:"Sleeps until 10:30, then works at his computer; evenings by the lake next to the house. Fridays and Saturdays: pool with Sam at the Saloon. Rainy days: the beach pier.",hobby:"Freelance programming, computer and tabletop games, comics, sci-fi novels, his motorcycle, pool, frogs",events:[["2♥","He talks about freelancing and feeling unappreciated"],["4♥","Working on his motorcycle, he promises you a ride"],["6♥","A tabletop game with him and Sam in his room"],["8♥","On a rainy beach he admits crowds make him anxious and shares his umbrella"],["10♥","A motorcycle ride to a viewpoint and a confession"],["14♥","Rescue an injured frog together in the rain"]],why:"He doesn't need a lot of people, just one who really gets him and will sit on the pier with him in the rain.",gifts:"Frozen tear, obsidian, sashimi, pumpkin soup"}},
  shane:{spouse:"M",color:"#5d6b8a",icon:"egg",bd:["sp",20],mbti:"ISTP",mbtiSrc:"pt",p:{soc:-2,art:-1,sci:-1,adv:-1,nat:1,care:1,edge:1,amb:-2,home:1},
    zh:{name:"谢恩",title:"外冷内热的养鸡人",desc:"一开始对谁都冷冰冰，熟悉后会发现他很疼教女贾斯，也特别会养鸡。",home:"玛妮牧场，和姨妈玛妮、教女贾斯同住",routine:"工作日早九晚五在Joja超市上班，大多数晚上在酒吧，周末常在牧场附近。",hobby:"打游戏、橄榄球（高中打过校队）、看电视、养鸡",events:[["6心","雨天在森林悬崖边找到他，他说出心里的低谷"],["7心","少喝了酒，攒钱给贾斯买了双好鞋"],["8心","在牧场的秘密房间里给你看他养的蓝色小鸡"],["10心","带你去祖祖城看球赛"],["14心","告诉你他用打游戏代替喝酒"]],why:"他需要时间才能敞开心扉，而你恰好愿意给他这个时间。",gifts:"辣椒、胡椒爆米花、披萨"},
    en:{name:"Shane",title:"The gruff chicken keeper",desc:"Cold to everyone at first. Once you know him, you'll find he dotes on his goddaughter Jas and is brilliant with chickens.",home:"Marnie's Ranch, with his aunt Marnie and goddaughter Jas",routine:"Works at JojaMart 9 to 5 on weekdays, spends most evenings at the Saloon, and stays near the ranch at weekends.",hobby:"Video games, gridball (he played varsity), TV, raising chickens",events:[["6♥","On a rainy day at the forest cliffs, he opens up about how low he's been"],["7♥","Cutting back on drinking, he buys Jas a good pair of shoes"],["8♥","He shows you his blue chickens in a hidden room at the ranch"],["10♥","A gridball game together in Zuzu City"],["14♥","He tells you video games help him stay off the drink"]],why:"He needs time to open up, and you're willing to give it to him.",gifts:"Hot pepper, pepper poppers, pizza"}},

/* =============== 音乐与音效（原创旋律） =============== */
let AC=null, musicTimer=null, nextT=0, step=0;
const N = (n)=>440*Math.pow(2,(n-69)/12);
const nm = {C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79,A5:81,G3:55,A3:57,B3:59,C3:48,D3:50,E3:52,F3:53,G2:43};
// 每项 [音, 拍]；一拍 = 一个四分音符
const MEL = [["G4",1],["B4",.5],["D5",.5],["E5",1],["D5",1],["B4",1],["A4",.5],["G4",.5],["A4",2],["G4",1],["B4",.5],["D5",.5],["G5",1],["E5",1],["D5",1.5],["B4",.5],["D5",2],
             ["E5",1],["D5",.5],["B4",.5],["C5",1],["A4",1],["B4",1],["G4",.5],["E4",.5],["D4",2],["E4",1],["G4",.5],["A4",.5],["B4",1],["D5",1],["A4",1.5],["B4",.5],["G4",2]];
const BASS = ["G2","D3","G2","D3","C3","G2","C3","D3"];
function tone(freq, t, dur, type, vol){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
const BEAT = 60/96;
let melTimes=null;
function scheduleMusic(){
  if(!melTimes){ melTimes=[]; let b=0; MEL.forEach(m=>{melTimes.push(b); b+=m[1];}); melTimes.total=b; }
  while(nextT < AC.currentTime + 0.4){
    const loopStart = nextT; const total=melTimes.total;
    MEL.forEach((m,i)=>{ const t=loopStart+melTimes[i]*BEAT; tone(N(nm[m[0]]),t,m[1]*BEAT*.9,"triangle",.07); });
    for(let bar=0;bar<total/4;bar++){ const root=nm[BASS[bar%BASS.length]];
      for(let q=0;q<4;q++){ const t=loopStart+(bar*4+q)*BEAT; tone(N(root+(q%2?7:0)),t,BEAT*.6,"square",.018); } }
    nextT = loopStart + total*BEAT;
  }
}
function startMusic(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){ return; }
  nextT = AC.currentTime + .1; melTimes=null; scheduleMusic();
  musicTimer = setInterval(()=>{ if(AC.currentTime > nextT - 1) scheduleMusic(); }, 300);
}
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; if(AC){ AC.close(); AC=null; } }
function sfx(kind){
  if(!S.sound || !AC) return; const t=AC.currentTime;
  if(kind==="pick"){ tone(880,t,.06,"square",.04); tone(1320,t+.05,.07,"square",.035); }
  if(kind==="hit"){ tone(110,t,.12,"square",.08); tone(70,t+.02,.15,"triangle",.08); }
  if(kind==="crack"){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.07,.2,"triangle",.07)); }
  if(kind==="season"){ [392,494,587,784].forEach((f,i)=>tone(f,t+i*.1,.25,"triangle",.06)); }
}

/* =============== 计分 =============== */
function zero(keys){const v={};keys.forEach(k=>v[k]=0);return v}
function addInto(a,b,w=1){for(const k in b)if(k in a)a[k]+=(b[k]||0)*w;return a}
function cosv(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return (na&&nb)?d/Math.sqrt(na*nb):0}
function pct(c){return Math.max(1,Math.min(99,Math.round(50+49*c)))}
function mbtiVec(t){return [t[0]==="E"?1:-1,t[1]==="N"?1:-1,t[2]==="F"?1:-1,t[3]==="P"?1:-1]}
const MBTI_W = 1.3;
/* 校准：让可结婚角色约占六成结果、结婚推荐分布均匀（由随机作答模拟得出） */
let BIAS_ME = {"abigail":-0.0042,"emily":0.0461,"haley":0.0702,"leah":-0.0188,"maru":0.1011,"penny":0.0006,"alex":0.0434,"elliott":0.0254,"harvey":0.1136,"sam":0.0001,"sebastian":0.0007,"shane":0.0976,"robin":0.0025,"demetrius":-0.0836,"linus":0.0445,"willy":-0.0383,"wizard":-0.0715,"krobus":-0.0209,"lewis":-0.0533,"marnie":-0.1048,"gus":-0.0466,"clint":-0.0479,"sandy":-0.0159,"pierre":-0.0399};
let BIAS_SP = {"abigail":-0.0503,"emily":0.0085,"haley":-0.0288,"leah":0.0097,"maru":0.0466,"penny":-0.0329,"alex":-0.0071,"elliott":0.0294,"harvey":0.0502,"sam":-0.0135,"sebastian":-0.0602,"shane":0.0484};
const NORM = (()=>{
  const tm=zero(TRAIT_KEYS), tv=zero(TRAIT_KEYS), am=zero(AXES), av=zero(AXES), pm=zero(TRAIT_KEYS);
  QUESTIONS.forEach(Q=>{
    const n=Q.o.length;
    TRAIT_KEYS.forEach(k=>{ const vals=Q.o.map(o=>o[2][k]||0), m=vals.reduce((a,b)=>a+b,0)/n;
      if(Q.pref) pm[k]+=m; else { tm[k]+=m; tv[k]+=vals.reduce((a,b)=>a+(b-m)**2,0)/n; } });
    if(!Q.pref) AXES.forEach(k=>{ const vals=Q.o.map(o=>o[3][k]||0), m=vals.reduce((a,b)=>a+b,0)/n;
      am[k]+=m; av[k]+=vals.reduce((a,b)=>a+(b-m)**2,0)/n; });
  });
  const ids=Object.keys(CHARS), cmean=zero(TRAIT_KEYS);
  ids.forEach(id=>addInto(cmean,CHARS[id].p,1/ids.length));
  const cvec={}, ctrait={};
  ids.forEach(id=>{ const t=TRAIT_KEYS.map(k=>(CHARS[id].p[k]||0)-cmean[k]); ctrait[id]=t; cvec[id]=t.concat(mbtiVec(CHARS[id].mbti).map(x=>x*MBTI_W)); });
  return {tm,tsd:Object.fromEntries(TRAIT_KEYS.map(k=>[k,Math.sqrt(tv[k])||1])),am,asd:Object.fromEntries(AXES.map(k=>[k,Math.sqrt(av[k])||1])),pm,cvec,ctrait};
})();
function compute(ans,g){
  const traw=zero(TRAIT_KEYS), araw=zero(AXES), praw=zero(TRAIT_KEYS);
  QUESTIONS.forEach((Q,i)=>{
    const o=Q.o[ans[i]];
    if(o){ if(Q.pref) addInto(praw,o[2]); else { addInto(traw,o[2]); addInto(araw,o[3]); } return; }
    // 跳过：按这道题的平均值计，等于不往任何方向偏
    Q.o.forEach(op=>{ if(Q.pref) addInto(praw,op[2],1/Q.o.length); else { addInto(traw,op[2],1/Q.o.length); addInto(araw,op[3],1/Q.o.length); } });
  });
  const tz=TRAIT_KEYS.map(k=>(traw[k]-NORM.tm[k])/NORM.tsd[k]);
  const az=AXES.map(k=>(araw[k]-NORM.am[k])/NORM.asd[k]);
  const type=az.map((v,i)=>v>=0?"ENFP"[i]:"ISTJ"[i]).join("");
  const user=tz.concat(az.map(v=>v*MBTI_W));
  const pref=TRAIT_KEYS.map(k=>praw[k]-NORM.pm[k]);
  const ranked=Object.keys(CHARS).map(id=>({id,s:cosv(user,NORM.cvec[id])+(BIAS_ME[id]||0)})).sort((a,b)=>b.s-a.s);
  const me=ranked[0];
  const spouses=Object.keys(CHARS).filter(id=>CHARS[id].spouse && id!==me.id && (g==="any"||CHARS[id].spouse===g))
    .map(id=>({id,s:0.75*cosv(user,NORM.cvec[id])+0.25*cosv(pref,NORM.ctrait[id])+(BIAS_SP[id]||0)})).sort((a,b)=>b.s-a.s);
  return {tz,az,type,ranked,me,spouses};
}
function sharedTraits(tz,cv){
  return TRAIT_KEYS.map((k,i)=>({k,u:tz[i],c:cv[i]})).filter(x=>x.u>0.3&&x.c>0.3).sort((a,b)=>b.u*b.c-a.u*a.c).slice(0,3).map(x=>T().traits[x.k]);
}
function letterMatch(a,b){let n=0;for(let i=0;i<4;i++)if(a[i]===b[i])n++;return n}
function bdText(bd){ const t=T(); return S.lang==="zh" ? t.seasons[bd[0]]+bd[1]+"日" : t.seasons[bd[0]]+" "+bd[1]; }

/* =============== 雷达 =============== */
const YOU_COL="#d8432f", CHAR_COL="#2563b0";
function radarVals(userZ, charP){
  return {uv:userZ.map(z=>Math.max(.08,Math.min(1,(z+2.2)/4.4))), cv:TRAIT_KEYS.map(k=>Math.max(.08,Math.min(1,((charP[k]||0)+2)/4)))};
}
function radar(userZ, charP){
  const n=TRAIT_KEYS.length, cx=190, cy=172, R=118;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]};
  const {uv,cv}=radarVals(userZ,charP);
  const P=(v)=>v.map((r,i)=>pt(i,R*r).map(x=>Math.round(x)).join(",")).join(" ");
  let g=`<polygon points="${P(TRAIT_KEYS.map(()=>1))}" fill="#fff8e6"/>`;
  [.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${P(TRAIT_KEYS.map(()=>f))}" fill="none" stroke="${f===1?"#8a5528":"#d4b588"}" stroke-width="${f===1?3:2}"/>`});
  TRAIT_KEYS.forEach((k,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${Math.round(x)}" y2="${Math.round(y)}" stroke="#d4b588" stroke-width="2"/>`;
    const [lx,ly]=pt(i,R+28);g+=`<text x="${Math.round(lx)}" y="${Math.round(ly)+6}" text-anchor="middle" font-size="${S.lang==="zh"?16:12}" fill="#3b2412">${esc(T().traits[k])}</text>`});
  g+=`<polygon points="${P(cv)}" fill="${CHAR_COL}" fill-opacity=".28" stroke="${CHAR_COL}" stroke-width="4" stroke-linejoin="miter"/>`;
  g+=`<polygon points="${P(uv)}" fill="${YOU_COL}" fill-opacity=".30" stroke="${YOU_COL}" stroke-width="4" stroke-linejoin="miter"/>`;

function hex2rgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}

      rect(0,40,N,3,"#5c3416"); rect(0,38,N,2,"#9a6236"); [[4,"#4f9a3a"],[9,"#c9622e"],[14,"#e2c060"],[50,"#8a3a5a"],[55,"#4f9a3a"],[59,"#3f6fc6"]].forEach(([x,c])=>{ rect(x,30,3,8,c); rect(x+1,28,1,2,c); });
      disc(10,8,7,"#c98a3e"); disc(10,8,4,"#f2d27a"); disc(10,8,2,"#fff3c4"); break;
    case "beach": grad("#f7c6a0","#f39aa8"); disc(48,30,8,"#ffe39a"); rect(0,34,N,10,"#4f8fd0"); for(let x=0;x<N;x+=5) rect(x+(x%3),36+(x%4),3,1,"#9fd0f0"); rect(0,44,N,20,"#f1d79a"); for(let i=0;i<30;i++) set(Math.floor(rnd(i)*N),46+Math.floor(rnd(i+50)*17),"#dcbf7e"); break;
    case "stars": grad("#1b2440","#3a3a6a"); for(let i=0;i<45;i++){ const x=Math.floor(rnd(i)*N), y=Math.floor(rnd(i+99)*40); set(x,y,i%7?"#c9d4ff":"#fff6b0"); }
      disc(50,10,6,"#f4efd0"); disc(53,8,5,"#2a3054"); rect(0,46,N,18,"#2a2f4a"); break;
    case "mine": rect(0,0,N,N,"#3d2e26"); for(let i=0;i<26;i++){ const x=Math.floor(rnd(i)*N), y=Math.floor(rnd(i+7)*N); disc(x,y,2+rnd(i+3)*3,i%2?"#4e3c31":"#33261f"); }
      [[6,20,"#7fd4f0"],[56,14,"#c78af0"],[8,48,"#c78af0"],[57,44,"#7fd4f0"]].forEach(([x,y,c])=>{ rect(x,y,2,4,c); rect(x-1,y+2,1,3,c); rect(x+2,y+1,1,3,c); set(x,y,"#ffffff"); }); break;
    case "forest": grad("#bfe3a8","#8fc97a"); [[2,"#4a7a34"],[14,"#5e8e3e"],[50,"#4a7a34"],[60,"#5e8e3e"]].forEach(([x,c])=>{ rect(x,22,3,42,"#6a4a2c"); disc(x+1,16,9,c); disc(x-3,22,6,c); disc(x+5,21,6,c); });
      rect(0,54,N,10,"#5f9a46"); for(let i=0;i<20;i++) set(Math.floor(rnd(i)*N),55+Math.floor(rnd(i+5)*8),"#7fbf5e"); break;
    case "garden": grad("#a9daf2","#d8f0f8"); rect(0,40,N,24,"#6fbf4a"); for(let x=0;x<N;x+=6){ rect(x,32,1,10,"#f4ead2"); } rect(0,34,N,1,"#f4ead2"); rect(0,38,N,1,"#f4ead2");
      for(let i=0;i<34;i++){ const x=Math.floor(rnd(i)*N), y=42+Math.floor(rnd(i+11)*20); set(x,y,["#f08fb0","#f6d55c","#ffffff","#c78af0"][i%4]); set(x,y+1,"#3f8a2c"); } break;
    case "rain": grad("#4a4560","#6e6a86"); for(let i=0;i<60;i++){ const x=Math.floor(rnd(i)*N), y=Math.floor(rnd(i+33)*N); set(x,y,"#9fa8c8"); set(x-1,y+1,"#9fa8c8"); set(x-2,y+2,"#8890b0"); } rect(0,52,N,12,"#3a3650"); break;
    case "fields": grad("#ffcf8a","#ffeec4"); disc(10,30,9,"#ffe7a0"); rect(0,34,N,30,"#8a5a30"); for(let y=36;y<N;y+=4){ rect(0,y,N,1,"#6e4422"); for(let x=(y%8);x<N;x+=5){ set(x,y-1,"#6fbf4a"); set(x+1,y-2,"#4f9a3a"); set(x,y-2,"#6fbf4a"); } } break;
    case "home": rect(0,0,N,N,"#e9c48a"); for(let x=0;x<N;x+=8) rect(x,0,3,46,"#efd09e"); rect(0,46,N,18,"#a8683a"); for(let x=0;x<N;x+=9) rect(x,46,1,18,"#8a5528");
      rect(44,8,16,16,"#6a3e1f"); rect(46,10,12,12,"#9fd3ef"); rect(51,10,2,12,"#6a3e1f"); rect(46,15,12,2,"#6a3e1f"); rect(4,10,10,8,"#6a3e1f"); rect(5,11,8,6,"#7fbf5e"); break;
  }
}
/* ---------- 头像渲染 v2：参照星露谷立绘的画法重写 ----------
   规则来自对官方 64×64 立绘的观察：脸约 26px 宽、下颌收窄；眼睛 7px 宽、两行粗上眼睑；
   阴影往橙红偏（不是灰），描边用暗红棕 / 暗紫，不用纯黑；头发四阶 + 斜向发丝高光；
   肩膀从第 48 行起到第 56 行撑满画面。所有部件仍是原创绘制，不含游戏素材。 */
function rgb2hsl(c){ let [r,g,b]=c.map(v=>v/255); const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return [h,s,l]; }
function hsl2rgb([h,s,l]){ h=((h%360)+360)%360; const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let [r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x]; return [(r+m)*255,(g+m)*255,(b+m)*255]; }
function hsh(hex,dl,ds,dh){ const [h,s,l]=rgb2hsl(hex2rgb(hex)); return rgb2hex(hsl2rgb([h+dh,Math.min(1,s+ds),Math.max(0,Math.min(1,l*dl))])); }
function mix(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b); return rgb2hex(A.map((v,i)=>v*(1-t)+B[i]*t)); }

function avPalette(A){
  const skin=(typeof A.skin==="string"&&A.skin[0]==="#")?A.skin:(AV_SKIN[A.skin]||AV_SKIN[2]);
  const P={skin};
  P.skinH=mix(tint(skin,.28),"#fff6e0",.25);
  P.skinS=hsh(skin,.84,.22,-5);          // 橙红偏的阴影
  P.skinD=hsh(skin,.62,.32,-11);
  P.skinO=mix(hsh(skin,.40,.30,-18),"#4a1830",.35);   // 暗红棕描边
  const hc=AV_HAIR[A.hairCol]||(typeof A.hairCol==="string"&&A.hairCol[0]==="#"?A.hairCol:AV_HAIR.darkbrown), hs=rgb2hsl(hex2rgb(hc));
  P.hc=hc;
  if(hs[1]<.18){  // 黑/灰发：往蓝紫偏
    P.hcL=mix(tint(hc,.22),"#7a6cb0",.38); P.hcS=mix(shade(hc,.80),"#3a2a5c",.35); P.hcD=mix(shade(hc,.55),"#2a1c48",.45); P.hcO=mix(shade(hc,.35),"#160b2e",.55);
  } else {
    const warm=hs[0]<70||hs[0]>300;      // 暖色头发阴影偏红，冷色偏紫蓝
    P.hcL=mix(tint(hc,.30),warm?"#fff0b8":"#e0f0ff",.22); P.hcS=hsh(hc,.74,.10,warm?-8:6); P.hcD=hsh(hc,.52,.16,warm?-14:10); P.hcO=mix(hsh(hc,.32,.20,warm?-18:14),"#1a0c34",.40);
  }
  const sh=(typeof A.shirt==="string"&&A.shirt[0]==="#")?A.shirt:(AV_SHIRT[A.shirt]||AV_SHIRT[0]), ss=rgb2hsl(hex2rgb(sh))[1];
  P.sh=sh; P.shL=tint(sh,.30); P.shS=ss<.15?mix(shade(sh,.78),"#3a3060",.3):hsh(sh,.74,.12,-6); P.shD=ss<.15?mix(shade(sh,.55),"#2a2048",.4):hsh(sh,.52,.18,-10); P.shO=mix(shade(sh,.32),"#180c30",.45);
  P.eyeD="#2e1c22"; P.white="#fff6f0";
  const ec=A.eyeCol||"#5a3a22"; P.iris=lumc(hex2rgb(ec))<60?tint(ec,.25):ec; P.pupil=shade(P.iris,.45); P.irisL=tint(P.iris,.45);
  P.lipD=mix(P.skinD,"#a8303c",.55); P.lipL=mix(skin,A.blush?"#ff7a86":"#e8786a",A.blush?.5:.32);
  P.blush=mix(skin,"#ff6a7c",.42); P.blushL=mix(skin,"#ff8a94",.25);
  const lightHair=["platinum","grey","blonde"].includes(A.hairCol);
  P.brow=lightHair?mix(P.skinD,"#6a4630",.6):P.hcD;
  return P;
}

function drawAvatarGrid(A, sceneName){
  const N=64, G=new Array(N*N).fill(null);
  const set=(x,y,c)=>{ x=Math.round(x); y=Math.round(y); if(x>=0&&y>=0&&x<N&&y<N) G[y*N+x]=c; };
  const get=(x,y)=>(x>=0&&y>=0&&x<N&&y<N)?G[y*N+x]:null;
  const L=new Uint8Array(N*N);   // 1 脸 2 头发 3 衣服 4 脖子耳朵
  const P=avPalette(A);
  const cx=32, fl=(x)=>A.flip?2*cx-1-x:x;
  const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;

  // ---- 头型：按行给半宽（参照官方立绘量出来的比例） ----
  const CHIN=A.face==="round"?46:47, TOP=8, CHEEK=A.face==="square"?14:A.face==="round"?14:13.5, CY=28;
  const hw=(y)=>{ if(y<TOP||y>CHIN) return -1;
    if(y<=CY) return CHEEK*Math.sqrt(Math.max(0,1-((CY-y)/(CY-TOP))**2));
    if(y<=35) return CHEEK;
    const t=(y-35)/(CHIN-35);
    if(A.face==="square") return y<=42?CHEEK-((y-35)/7)*1.2:CHEEK-1.2-((y-42)/(CHIN-42))*(CHEEK-1.2-6.5);
    if(A.face==="round") return CHEEK-(t*t)*(CHEEK-6.5);
    return CHEEK-t*(CHEEK-5)-Math.sin(t*Math.PI)*1.2; };
  const headIn=(x,y)=>{ const h=hw(y); return h>=0&&Math.abs(x+.5-cx)<=h; };
  const paint=(inside,id,colFn,outline)=>{ for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(!inside(x,y)) continue;
    const edge=!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);
    set(x,y,edge&&outline?outline:colFn(x,y)); if(id) L[y*N+x]=id; } };

  drawScene(set,N,sceneName);

  // ---- 发际线（各发型）----
  const ey=31;                                   // 上眼睑第一行
  const side=(x)=>Math.abs(x+.5-cx)>CHEEK-3.5;
  const spike=(x,period,h,ph)=>{ const k=((x+ph)%period+period)%period; const c=(period-1)/2; return Math.max(0,h-Math.abs(k-c)*(h/(c||1))); };   // 向下的尖刘海
  const hashx=(x,m)=>((x*2654435761)>>>0)%m;
  let hairline;
  switch(A.hair){
    case "short":    hairline=(x)=>side(x)? 30 : 20+Math.round(spike(x,6,3,1)); break;
    case "sidepart": hairline=(x)=>{ const X=fl(x), t=(X+.5-(cx-CHEEK))/(2*CHEEK); return side(x)? 30 : 18+Math.round(t*9+spike(x,5,2,2)); }; break;
    case "bangs":    hairline=(x)=>side(x)? 34 : 25+Math.round(spike(x,4,2,0)); break;
    case "long":     hairline=(x)=>{ const d=Math.abs(x+.5-cx); return d>CHEEK-3.5? 52 : d<2? 17 : 20+Math.min(5,(d-2)*.8)+Math.round(spike(x,5,2,1)); }; break;
    case "bun":      hairline=(x)=>side(x)? 29 : 19+Math.round(spike(x,7,1,0)); break;
    case "curly":    hairline=(x)=>side(x)? 35 : 23+((x%3===0)?2:(x%3===1)?1:0); break;
    case "pony":     hairline=(x)=>{ const X=fl(x); return side(x)? 30 : 20+(X<cx?2:0)+Math.round(spike(x,6,3,3)); }; break;
    case "buzz":     hairline=(x)=>Math.abs(x+.5-cx)>CHEEK-2? 26 : 18; break;
    default:         hairline=(x)=>20;
  }
  const ex2=A.hair==="curly"?2.2:A.hair==="buzz"?-1.4:A.hair==="long"?1.2:0.6;
  const tufty=["short","sidepart","curly","pony","bangs"].includes(A.hair);
  const capF=(x,y)=>{ const dx=(x+.5-cx)/(CHEEK+2.4+ex2), dy=(y+.5-(CY-1))/(CY-TOP+2.8+ex2); let r=1;
    if(tufty&&dy<0.1){ const ang=Math.atan2(dy,dx), seg=Math.floor((ang+Math.PI)/(Math.PI/9)); r=1+[0,.045,.09,.03][hashx(seg+(A.hair==="curly"?2:0),4)]*(A.hair==="curly"?1.6:1); }
    return dx*dx+dy*dy<=r*r; };
  const bumpy=(x,y)=>true;
  const hairFront=(x,y)=>capF(x,y)&&y<hairline(x)&&bumpy(x,y);
  const hairBack=(x,y)=>{
    if(A.hair==="long") return y>=14&&y<=61&&Math.abs(x+.5-cx)<=CHEEK+4.5-(y>52?(y-52)*.7:0)&&!(y>54&&Math.abs(x+.5-cx)<8);
    if(A.hair==="pony"){ const X=fl(x); return ((X+.5-(cx+CHEEK+3))/4.8)**2+((y+.5-36)/13)**2<=1; }
    if(A.hair==="bun") return ((x+.5-cx)/6.5)**2+((y+.5-(TOP-2))/5)**2<=1;
    if(A.hair==="curly") return ((x+.5-cx)/(CHEEK+5))**2+((y+.5-(CY+1))/(CY-TOP+5))**2<=1&&y<=CY+10;
    return false; };
  const hairAny=(x,y)=>hairFront(x,y)||hairBack(x,y);
  const hairCol=(x,y)=>{   // 四阶 + 斜向发丝
    if(A.hair==="buzz"){ const base=mix(P.hc,P.skin,.35); return (x+y)%3?base:mix(base,P.hcS,.5); }
    const top=TOP-3-ex2, rel=y-top, dx=(x+.5-cx)/(CHEEK+3);
    const nearBottom=y>=hairline(x)-3&&hairFront(x,y)&&!(A.hair==="long"&&side(x));
    if(dx>.58||nearBottom||(hairBack(x,y)&&!hairFront(x,y)&&(x+.5-cx)>CHEEK-2)) return (x+y)%5===0&&!nearBottom?P.hc:P.hcS;
    if(dx<-.72) return P.hcS;
    // 发丝高光：从头顶向右下的斜条
    const u=x+rel*.38-cx+40, s=Math.floor(u/5), pos=u-s*5, len=8+hashx(s,7), start=hashx(s+3,3), q=(rel-start)/len;
    if(s%2===0&&q>=0&&q<1&&dx>-.62&&dx<.52){ const w=q<.15||q>.8?1:q<.3||q>.65?2:3; if(pos<w) return P.hcL; }
    if(s%2===1&&q>.1&&q<1.3&&pos<1&&dx>-.7) return P.hcS;   // 发绺之间的分界线
    return P.hc; };

  // ---- 后层头发 ----
  if(A.hair!=="buzz") paint((x,y)=>hairBack(x,y)&&!headIn(x,y), 2, hairCol, P.hcO);

  // ---- 衣服与肩 ----
  const SH=48;
  const shirtIn=(x,y)=>y>=SH&&Math.abs(x+.5-cx)<=10+(y-SH)*3.4;
  paint(shirtIn, 3, (x,y)=>{ const d=x+.5-cx, lim=10+(y-SH)*3.4;
    if(d>lim*.45) return d>lim*.92?P.shD:P.shS;
    if(y===SH+1+Math.max(0,Math.floor((Math.abs(d)-10)/3.4))&&d<-8) return P.shL;
    return P.sh; }, P.shO);
  // V 领：领口露皮肤 + 衣领亮边
  const vIn=(x,y)=>y>=SH&&y<=SH+5&&Math.abs(x+.5-cx)<=4-(y-SH)*.8;
  paint(vIn, 4, (x,y)=>y>=SH+3?P.skinD:P.skinS, null);
  for(let y=SH;y<=SH+5;y++){ const d=Math.max(0,Math.round(4-(y-SH)*.8)); set(cx-d-1,y,P.shO); set(cx+d,y,P.shO); set(cx-d-2,y,P.shL); set(cx+d+1,y,P.shD); }
  // ---- 脖子 ----
  paint((x,y)=>y>=CHIN-4&&y<SH&&Math.abs(x+.5-cx)<=5, 4, (x,y)=>(y<=CHIN+1)?P.skinD:((x+.5-cx)<-2?P.skin:P.skinS), P.skinO);
  // ---- 耳朵 ----
  if(!["long","curly"].includes(A.hair)) [-1,1].forEach(s=>paint((x,y)=>((x+.5-(cx+s*(CHEEK+.5)))/2.6)**2+((y+.5-(ey+2))/4)**2<=1&&!headIn(x,y), 4,
    (x,y)=>(s>0||y>ey+3)?P.skinS:P.skin, P.skinO));
  // ---- 脸 ----
  paint(headIn, 1, (x,y)=>{ const h=hw(y), d=x+.5-cx;
    if(d>h-2.8&&y>CY-6) return (d>h-1.3&&y>CY+2||y>CHIN-3)?P.skinD:P.skinS;      // 右侧暗面
    if(y>CHIN-2) return P.skinS;
    if(y<hairline(x)+2&&y>=hairline(x)-1) return P.skinS;                   // 刘海下的阴影
    if(d<-6&&d>-10&&y>ey+3&&y<ey+7) return P.skinH;                          // 左颊高光
    return P.skin; }, null);
  // 描边：只画没被头发盖住的轮廓
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(L[y*N+x]!==1) continue;
    const edge=!headIn(x-1,y)||!headIn(x+1,y)||!headIn(x,y+1); if(edge&&y>=hairline(x)) set(x,y,P.skinO); }

  // ---- 胡子 ----
  if(A.beard){ for(let y=ey+8;y<=CHIN;y++) for(let x=0;x<N;x++){ if(L[y*N+x]!==1) continue; const h=hw(y), d=Math.abs(x+.5-cx);
      if(y<ey+11&&d<h-4) continue; if(y<ey+13&&d<4) continue;
      set(x,y,(x*3+y)%7===0?P.hcL:(d>h-2.5||y>CHIN-1)?P.hcD:((x+y)%4===0?P.hcS:P.hc)); } }

  // ---- 前层头发 ----
  if(A.hair!=="buzz") paint(hairFront, 2, hairCol, P.hcO);
  else paint(hairFront, 2, hairCol, mix(P.hcO,P.skinO,.5));
  if(A.hair==="curly") for(let y=0;y<CY+12;y++) for(let x=0;x<N;x++){ if(L[y*N+x]!==2) continue; const c=get(x,y); if(c===P.hcO) continue;
      const u=x%5, v=(y+((x/5|0)%2)*2)%5; if((u===1&&v===0)||(u===0&&v===1)||(u===2&&v===1)||(u===1&&v===2)) set(x,y,c===P.hcS?P.hc:P.hcL); else if(u===1&&v===1) set(x,y,P.hcS); }
  // 发尾挑染
  if(A.tips&&A.hair!=="buzz"){ const tc=AV_HAIR[A.tips]||A.tips, tcL=tint(tc,.25), tcD=hsh(tc,.6,.1,0);
    for(let x=0;x<N;x++){ if(Math.abs(x+.5-cx)<CHEEK-7) continue; let n2=0; for(let y=N-1;y>=0&&n2<5;y--){ if(L[y*N+x]===2&&get(x,y)!==P.hcO){ set(x,y,n2===0?tcD:n2<3?tc:tcL); n2++; } else if(n2) break; } } }

  // ---- 五官 ----
  const exL=cx-10, exR=cx+4;   // 各 7 格宽
  const EYES={
    big:  [".DDDDD.","DDDDDDD","DWHIIWD","DWIPIWD",".WIIIW.","..LLL.."],
    mid:  [".DDDDD.","DDDDDDD","DWHIIWD",".WIPIW.","..LLL.."],
    small:[".DDDDD.","DDDDDDD",".WHPIW.","..LLL.."] };
  const tpl=EYES[A.eyes]||EYES.mid;
  const EC={D:P.eyeD,W:P.white,H:P.irisL,I:P.iris,P:P.pupil,L:P.skinS};
  [[exL,true],[exR,false]].forEach(([ex,left])=>{
    tpl.forEach((row,j)=>[...row].forEach((ch,i)=>{ if(ch==="."||!EC[ch]) return; const ii=left?i:6-i; // 右眼镜像眼型
      let c=EC[ch]; if(!left&&ch==="H") c=P.iris; if(!left&&ch==="I"&&i===4&&j===2) c=P.irisL;   // 高光保持在同一侧
      set(ex+ii,ey+j,c); }));
    // 眉毛：6 格，外侧两格低一行
    for(let i=0;i<6;i++){ const outer=left?i<2:i>3; set(ex+i+(left?0:1),ey-4+(outer?1:0),P.brow); }
  });
  // 鼻子
  set(cx+1,ey+8,P.skinS); set(cx+1,ey+9,P.skinS); set(cx+2,ey+9,P.skinD); set(cx+2,ey+8,P.skinS);
  // 嘴
  const my=ey+12;
  if(A.mouth==="calm"){ for(let x=cx-3;x<=cx+2;x++) set(x,my,P.lipD); for(let x=cx-2;x<=cx+1;x++) set(x,my+1,P.lipL); }
  else if(A.mouth==="smile"){ set(cx-5,my-1,P.lipD); set(cx+4,my-1,P.lipD); for(let x=cx-4;x<=cx+3;x++) set(x,my,P.lipD); for(let x=cx-2;x<=cx+1;x++) set(x,my+1,P.lipL); set(cx-3,my+1,P.skinS); set(cx+2,my+1,P.skinS); }

/* ---------- 识别 ---------- */
let _faceApi=null;
function loadFaceApi(){
  if(_faceApi) return _faceApi;
  _faceApi=new Promise((res,rej)=>{
    if(window.faceapi) return res(window.faceapi);
    const s=document.createElement("script"); s.src="vendor/face-api.js"; s.onload=()=>res(window.faceapi); s.onerror=()=>rej(new Error("load")); document.head.appendChild(s);
  }).then(async fa=>{
    // 模型权重以 base64 存在 JSON 里（有的托管不支持 .bin 文件）
    const load=async(net,name)=>{ const m=await fetch("vendor/models/"+name+".json").then(r=>{ if(!r.ok) throw new Error("model"); return r.json(); });
      const bin=atob(m.data), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      net.loadFromWeightMap(fa.tf.io.decodeWeights(u.buffer,m.specs)); };
    await load(fa.nets.tinyFaceDetector,"tiny_face_detector_model"); await load(fa.nets.faceLandmark68Net,"face_landmark_68_model"); return fa; });
  _faceApi.catch(()=>{ _faceApi=null; });
  return _faceApi;
}
async function analyseFace(img){
  const fa=await loadFaceApi();

  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const g=cv.getContext("2d"); g.drawImage(img,0,0,W,H);
  const det=await fa.detectSingleFace(cv,new fa.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.35})).withFaceLandmarks();
  if(!det) return null;
  const P=det.landmarks.positions, D=g.getImageData(0,0,W,H).data;
  const px=(x,y)=>{ x=Math.max(0,Math.min(W-1,Math.round(x))); y=Math.max(0,Math.min(H-1,Math.round(y))); const o=(y*W+x)*4; return [D[o],D[o+1],D[o+2]]; };
  const median=(x0,y0,x1,y1)=>{ const a=[[],[],[]]; const st=Math.max(1,Math.round(Math.min(x1-x0,y1-y0)/12));
    for(let y=Math.max(0,y0);y<Math.min(H,y1);y+=st) for(let x=Math.max(0,x0);x<Math.min(W,x1);x+=st){ const c=px(x,y); a[0].push(c[0]);a[1].push(c[1]);a[2].push(c[2]); }
    if(!a[0].length) return null; return a.map(v=>{v.sort((p,q)=>p-q);return v[v.length>>1];}); };
  const d=(i,j)=>Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
  const left=Math.min(...P.slice(0,17).map(p=>p.x)), right=Math.max(...P.slice(0,17).map(p=>p.x));
  const browY=Math.min(...P.slice(17,27).map(p=>p.y)), chinY=P[8].y, fw=right-left, fh=chinY-browY, cx=(left+right)/2;
  const box=(x,y,r)=>median(x-r,y-r,x+r,y+r);
  const skin=median(P[2].x+(P[31].x-P[2].x)*.35-fw*.05,P[29].y-fw*.04,P[2].x+(P[31].x-P[2].x)*.35+fw*.05,P[29].y+fw*.06) || [220,180,150];
  const skin2=median(P[14].x-(P[14].x-P[35].x)*.35-fw*.05,P[29].y-fw*.04,P[14].x-(P[14].x-P[35].x)*.35+fw*.05,P[29].y+fw*.06) || skin;
  const sk=skin.map((v,i)=>(v+skin2[i])/2);
  const bgc=median(0,0,W*.12,H*.15)||[200,200,200];
  // 头发：在眉毛上方到太阳穴这一圈收集“不像皮肤”的像素，再分两类，取数量多的那类当发色。
  // 不再只取一个点，免得被背景（天空、树叶）或额头骗到。
  const collect=(x0,y0,x1,y1)=>{ const out=[]; const st=Math.max(1,Math.round((x1-x0)/40));
    for(let y=Math.max(0,y0);y<Math.min(H,y1);y+=st) for(let x=Math.max(0,x0);x<Math.min(W,x1);x+=st) out.push(px(x,y)); return out; };

  const twoMeans=(arr)=>{ if(arr.length<8) return null; const sorted=arr.slice().sort((p,q)=>lumc(p)-lumc(q));
    let c1=sorted[Math.floor(arr.length*.2)], c2=sorted[Math.floor(arr.length*.8)], a1=[],a2=[];
    for(let it=0;it<8;it++){ a1=[];a2=[]; arr.forEach(c=>(cdist(c,c1)<=cdist(c,c2)?a1:a2).push(c));
      const mean=a=>a.length?[0,1,2].map(i=>a.reduce((s,c)=>s+c[i],0)/a.length):null; c1=mean(a1)||c1; c2=mean(a2)||c2; }
    // 头发通常比背景更集中在脸的上沿：数量多的那类；数量接近时取更暗的
    const main=(a1.length>=a2.length*.8)? 1 : 2;
    return {hair:main===1?c1:c2, other:main===1?c2:c1, otherFrac:(main===1?a2:a1).length/arr.length}; };
  const tm=twoMeans(band); const hairS=tm?tm.hair:[50,35,28];
  // 挑染 / 发尾染色：第二类颜色偏暖、够鲜艳、占比不小，而且不像树叶或天空
  let tipsRGB=null;
  if(tm){ const o=tm.other, sat=Math.max(...o)-Math.min(...o);
    if(tm.otherFrac>.12 && sat>45 && o[0]>o[1]&&o[0]>o[2] && cdist(o,hairS)>45 && cdist(o,sk)>30) tipsRGB=o; }

  const isHair=c=>cdist(c,hairS)<Math.min(55,cdist(c,sk)*.85);
  const frac=(x0,y0,x1,y1)=>{ const a=collect(x0,y0,x1,y1); return a.length? a.filter(isHair).length/a.length : 0; };
  const fL=frac(cx-fw*.32,browY-fh*.26,cx-fw*.04,browY-fh*.04), fR=frac(cx+fw*.04,browY-fh*.26,cx+fw*.32,browY-fh*.04);
  const temple=Math.max(frac(left-fw*.06,browY-fh*.2,left+fw*.1,browY+fh*.15), frac(right-fw*.1,browY-fh*.2,right+fw*.06,browY+fh*.15));
  const sideLong=Math.max(frac(left-fw*.2,chinY-fh*.3,left-fw*.03,chinY), frac(right+fw*.03,chinY-fh*.3,right+fw*.2,chinY));
  const hairVsSkin=cdist(hairS,sk);
  let hair="short", flip=false;
  if(band.length<20 || (temple<.15 && Math.max(fL,fR)<.12)) hair="buzz";
  else if(sideLong>.45) hair="long";
  else if(fL>.45&&fR>.45&&Math.abs(fL-fR)<.25) hair="bangs";
  else if((fL>.3||fR>.3)&&Math.abs(fL-fR)>=.2){ hair="sidepart"; flip=fR>fL; }
  else if(fL>.35&&fR>.35) hair="bangs";
  // 发色：先提一点饱和度再找最近的
  const boost=c=>{const m=(c[0]+c[1]+c[2])/3;return c.map(v=>m+(v-m)*1.25)};
  let hairCol="darkbrown", best=1e9; for(const k in AV_HAIR){ const dd=cdist(boost(hairS),hex2rgb(AV_HAIR[k])); if(dd<best){best=dd;hairCol=k;} }
  if(hair==="buzz"&&lumc(hairS)>140) hairCol="darkbrown";
  let tips=null; if(tipsRGB&&hair!=="buzz"){ let bd=1e9; for(const k in AV_HAIR){ const dd=cdist(boost(tipsRGB),hex2rgb(AV_HAIR[k])); if(dd<bd){bd=dd;tips=k;} } if(tips===hairCol||!["ginger","blonde","platinum","red","pink","purple","blue","green"].includes(tips)) tips=null; }
  // 肤色按亮度对应
  const sl=lumc(sk); let skinI=0, bl=1e9; AV_SKIN.forEach((h,i)=>{ const dd=Math.abs(lumc(hex2rgb(h))-(sl*1.12+14)); if(dd<bl){bl=dd;skinI=i;} });  // 手机自拍脸部通常偏暗，往亮调一点
  // 脸型
  const jaw=d(5,11)/d(0,16), aspect=fw/fh;
  const face= jaw>.8 ? "square" : (aspect>1.32||jaw>.74) ? "round" : "oval";
  // 眼睛开合
  const ear=(a,b,c,e,f,h)=>(d(b,h)+d(c,f))/(2*d(a,e));
  const eo=(ear(36,37,38,39,40,41)+ear(42,43,44,45,46,47))/2;
  const eyes= eo>.33 ? "big" : eo<.22 ? "small" : "mid";
  // 表情
  const mw=d(48,54), open=d(62,66)/mw, lift=(((P[62].y+P[66].y)/2)-((P[48].y+P[54].y)/2))/mw;
  const mouth= open>.14 ? "grin" : lift>.02 ? "smile" : "calm";
  // 胡子：下巴明显比脸颊暗，而且接近发色
  const chin=median(cx-fw*.1,P[57].y+fh*.04,cx+fw*.1,chinY-fh*.03);
  const beard=!!chin && lumc(chin)<lumc(sk)*.72 && cdist(chin,hairS)<cdist(chin,sk);
  // 眼镜：两眼之间鼻梁上有一条明显的横向边缘
  let gsum=0,gn=0; const gy0=Math.min(P[39].y,P[42].y)-fh*.08, gy1=P[28].y;
  for(let x=P[39].x+2;x<P[42].x-2;x+=1){ let mx=0; for(let y=gy0;y<gy1;y++){ const a=lumc(px(x,y)), b=lumc(px(x,y+2)); mx=Math.max(mx,Math.abs(a-b)); } gsum+=mx; gn++; }
  const glasses = gn>0 && gsum/gn>58;
  // 衣服：下巴下面
  let shirt=null; if(chinY+fh*.5<H){ const s=median(cx-fw*.35,chinY+fh*.45,cx+fw*.35,Math.min(H,chinY+fh*.75)); if(s&&cdist(s,sk)>30) shirt=rgb2hex(boost(s)); }
  // 眼睛颜色
  const eyeC=box((P[37].x+P[40].x)/2,(P[37].y+P[40].y)/2,Math.max(1,d(36,39)*.12))||[40,30,25];
  return {hair,flip,hairCol,tips,skin:skinI,face,eyes,mouth,beard,glasses,blush:mouth!=="calm",
    shirt:shirt||"#4f9a3a",shirtFromPhoto:shirt,eyeCol:rgb2hex(eyeC)};
}
function avSummary(A){
  const t=T(), j=S.lang==="zh"?"、":", ";
  const parts=[ S.lang==="zh" ? t.avHairCol[A.hairCol]+t.avHair[A.hair] : t.avHairCol[A.hairCol]+" "+t.avHair[A.hair].toLowerCase(),
    t.avFace[A.face], t.avMouth[A.mouth]];

  if(A.tips) parts.splice(1,0,S.lang==="zh"?t.avHairCol[A.tips]+"发尾":t.avHairCol[A.tips]+" tips");
