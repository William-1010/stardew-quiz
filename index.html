:root{
  --wood:#c9853e; --wood-d:#8a5528; --wood-dd:#5c3416; --paper:#fbe6b5; --paper2:#f3d595; --paper3:#e9c48a;
  --ink:#3b2412; --ink-soft:#7a5230; --accent:#e2574c; --green:#4f9a3a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"FusionPixel","Noto Sans SC",monospace;color:var(--ink);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:none;font-smooth:never;padding:64px 12px 40px;background:#78c6f0}
#bg{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;image-rendering:pixelated;z-index:0}
img,svg,canvas{image-rendering:pixelated}

/* 顶栏 */
#hud{position:fixed;top:10px;right:10px;z-index:5;display:flex;gap:8px}
.hudbtn{font:inherit;font-size:14px;cursor:pointer;color:#fff8e6;background:var(--wood-dd);border:none;padding:6px 10px;
  box-shadow:0 -3px 0 0 var(--wood-dd),0 3px 0 0 var(--wood-dd),-3px 0 0 0 var(--wood-dd),3px 0 0 0 var(--wood-dd),inset 0 -3px 0 rgba(0,0,0,.25)}
.hudbtn.on{background:var(--green)}

/* 木框面板：像素缺角 */
.wrap{position:relative;z-index:1;max-width:700px;margin:0 auto}
.frame{filter:drop-shadow(0 6px 0 rgba(60,30,10,.45))}
.panel{position:relative;background:var(--paper);padding:30px 26px 26px;
  clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
  box-shadow:inset 0 0 0 4px var(--wood-dd),inset 0 0 0 8px var(--wood),inset 0 0 0 12px var(--wood-d),inset 0 0 0 14px var(--paper3)}
.foot{position:relative;z-index:1;text-align:center;font-size:12px;color:#fff8e6;margin-top:16px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}

/* 文字 */
.center{text-align:center}
.muted{color:var(--ink-soft);font-size:14px}
.h2{font-size:26px;text-align:center;margin:4px 0 4px;color:var(--wood-dd);font-weight:400}
.logo{text-align:center;margin:4px 0 18px}

.letter p{margin:0 0 10px;line-height:1.8}
.letter-head{font-size:18px;color:var(--wood-dd)}
.letter-sign{text-align:right;color:var(--ink-soft)}
p{line-height:1.75}

/* 按钮 */
.btn{display:inline-block;text-decoration:none;font:inherit;font-size:20px;cursor:pointer;border:none;color:#fff8e6;background:var(--accent);padding:10px 22px;margin:4px;
  box-shadow:0 -4px 0 0 #7d2a22,0 4px 0 0 #7d2a22,-4px 0 0 0 #7d2a22,4px 0 0 0 #7d2a22,inset 0 -5px 0 #b33f36,inset 0 4px 0 #f08a7e}

.btn:active{transform:translateY(3px)}
.btn.ghost{background:var(--paper2);color:var(--ink);box-shadow:0 -4px 0 0 var(--wood-dd),0 4px 0 0 var(--wood-dd),-4px 0 0 0 var(--wood-dd),4px 0 0 0 var(--wood-dd),inset 0 -5px 0 var(--paper3),inset 0 4px 0 #fff3d0}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.link{background:none;border:none;font:inherit;font-size:14px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;padding:4px}

/* 表单 */
.form{display:grid;gap:12px;margin:14px 0 6px}
.form label{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center;color:var(--ink-soft)}
.form .row{display:flex;gap:8px;align-items:center}
.form em{font-style:normal;color:var(--ink);white-space:nowrap}
input{font:inherit;font-size:18px;color:var(--ink);background:#fff8e6;border:none;padding:8px 10px;width:100%;
  box-shadow:inset 0 0 0 3px var(--wood-d),inset 3px 3px 0 3px var(--paper3)}
input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--accent),inset 3px 3px 0 3px var(--paper3)}

/* 题目 */
.crops{display:grid;grid-template-columns:repeat(21,1fr);gap:2px;margin-bottom:10px;background:#8a5528;padding:4px 4px 0}
.crops img{width:100%;height:auto;display:block}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-soft);margin-bottom:12px}
.daytag{color:#fff8e6;padding:3px 10px;font-size:15px}
.s-sp.daytag{background:#4f9a3a}.s-su.daytag{background:#d98a1e}.s-fa.daytag{background:#b8572a}.s-wi.daytag{background:#5b7fa8}
.qtext{font-size:22px;line-height:1.55;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:17px;color:var(--ink);cursor:pointer;
  background:#fff8e6;border:none;padding:11px 14px;line-height:1.5;box-shadow:inset 0 0 0 3px var(--paper3),0 3px 0 var(--paper3)}
.opt .arrow{color:var(--accent);visibility:hidden;flex:none}
.opt:hover{box-shadow:inset 0 0 0 3px var(--wood),0 3px 0 var(--wood)}
.opt:hover .arrow,.opt.picked .arrow{visibility:visible}
.opt.picked{background:#ffe3cf;box-shadow:inset 0 0 0 3px var(--accent),0 3px 0 #b33f36}
.gender{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gender .opt{justify-content:center;font-size:20px}
.nav{margin-top:14px}

/* 过场 */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;color:#fff8e6;cursor:pointer}
.ov.show{display:flex;animation:ovIn .35s steps(5)}
.ov.s-sp{background:#2f6a22}.ov.s-su{background:#a8601a}.ov.s-fa{background:#7d3a1c}.ov.s-wi{background:#2e4a6e}
.ov.night{background:#141428;cursor:default}
.ov-inner{padding:20px;max-width:560px}
.ov-title{font-size:40px;line-height:1.2;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.ov-tip{font-size:18px;margin-top:12px;opacity:.95}
.ov-lines p{font-size:20px;margin:10px 0}
.walker{position:relative;height:60px;margin-top:26px;width:320px;max-width:80vw;overflow:hidden;margin-left:auto;margin-right:auto}
.walker .chick{position:absolute;bottom:0;width:48px;height:48px;transform:scaleX(-1);animation:walk 2.2s linear forwards}
@keyframes walk{from{left:-50px}to{left:100%}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.geode-wrap{position:relative;display:inline-block;cursor:pointer;padding:10px}
.geode-wrap canvas{width:176px;height:176px;display:block}

@keyframes spark{to{transform:rotate(var(--a)) translateY(-130px);opacity:0}}
.reveal{margin-top:14px}
.reveal .emblem{margin:0 auto 8px;display:block}

.result-head{text-align:center;color:var(--ink-soft)}
.big{font-size:38px;text-align:center;margin:6px 0 0;color:var(--wood-dd)}
.tag{display:block;text-align:center;color:var(--accent);font-size:18px;margin:4px 0 12px}

.card h4{margin:14px 0 4px;font-size:17px;color:var(--wood-dd);font-weight:400}
.card p{margin:10px 0 0}
.profile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.profile .emblem{margin:4px}
.kv{display:grid;grid-template-columns:6em 1fr;gap:6px 10px;font-size:15px;line-height:1.7;margin:10px 0 0}
.kv dt{color:var(--ink-soft)}.kv dd{margin:0}
.events{list-style:none;margin:6px 0 0;padding:0;font-size:15px}
.events li{display:grid;grid-template-columns:minmax(4em,auto) 1fr;gap:8px;padding:5px 0;border-bottom:2px dashed var(--paper3)}
.events b{color:var(--accent);font-weight:400}
.src{font-size:12px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips.center{justify-content:center}
.chip{font-size:13px;background:var(--paper2);padding:3px 9px}
.note{font-size:14px;color:var(--ink-soft);line-height:1.75}
.radar-wrap{display:flex;flex-direction:column;align-items:center}
.radar-wrap text{font-family:"FusionPixel",monospace}
.legend{display:flex;gap:18px;font-size:14px;color:var(--ink-soft)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.mbti-big{font-size:40px;letter-spacing:6px;text-align:center;color:var(--wood-dd);margin:0 0 8px}
.axes{display:grid;gap:8px}
.axis{display:grid;grid-template-columns:8.5em 1fr 8.5em;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft)}
.axis span:last-child{text-align:right}
.axis .on{color:var(--ink)}
.tbar{height:12px;background:var(--paper3);position:relative}
.tbar.mid::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--wood-d)}
.tbar i{position:absolute;top:0;bottom:0;background:var(--accent)}
.bname{font-size:22px;font-weight:400}
.pct{color:var(--accent);font-size:20px}
.heart{color:var(--accent)}
.others{display:grid;gap:4px}
.other{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:2px dashed var(--paper3)}
.other .who{display:flex;align-items:center;gap:4px}
.other .pct{font-size:17px}
.idimg{width:100%;max-width:640px;margin-top:14px;box-shadow:0 6px 0 rgba(60,30,10,.35)}
.toast{text-align:center;font-size:14px;color:var(--green);min-height:20px;margin-top:8px}
.sources{margin-top:22px;padding-top:12px;border-top:3px dashed var(--paper3);font-size:12px;line-height:1.8;color:var(--ink-soft)}
.sources a{color:var(--wood-d)}
.fade{animation:fade .3s steps(4)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  body{font-size:15px}

  .logo-big{font-size:26px}
  .qtext{font-size:19px}
  .opt{font-size:16px}
  .gender{grid-template-columns:1fr}
  .profile{grid-template-columns:1fr}
  .form label{grid-template-columns:1fr;gap:4px}
  .axis{grid-template-columns:6.5em 1fr 6.5em;font-size:12px}
  .ov-title{font-size:32px}
  .kv{grid-template-columns:4.5em 1fr}

    en:{name:"Elliott",title:"The romantic writer by the sea",desc:"Long-haired, flowery in speech and a true romantic, he's set on writing a great novel.",home:"Elliott's Cabin on the beach, next to Willy's Fish Shop",routine:"Mostly at his cabin or on the bridge by the river. The library in fall and winter, and now and then Pierre's or the Saloon.",hobby:"Writing novels, reading, gazing at the sea, playing piano",events:[["2♥","Pick your favourite novel genre at his cabin"],["4♥","A toast together at the Saloon"],["6♥","He plays piano for you at home"],["8♥","A museum reading of his novel, in the genre you picked"],["10♥","He invites you out on a rowboat"]],why:"He'll write your everyday life into his stories, and you'll be the first to read them.",gifts:"Crab cakes, duck feather, pomegranate, lobster"}},

    zh:{name:"哈维",title:"谨慎的好医生",desc:"镇上唯一的医生，温和、细心，有点胆小，会担心每个人的身体。",home:"诊所楼上的小公寓",routine:"周二、周四给村民做体检；其他日子上午看前台，下午在镇上散步锻炼。周六去博物馆，雨天傍晚去酒吧。",hobby:"读书、摆弄收音机、做模型飞机、听爵士、健身操",events:[["2心","为健康问题和乔治争执，你选一边"],["4心","在诊所给你测脉搏"],["6心","撞见他偷偷上健身操课"],["8心","用收音机联系上真正的飞行员，说出想飞的梦想"],["10心","和你一起坐热气球"],["14心","下厨给你做晚饭，还主动洗碗"]],why:"他会把你照顾得很好，而你能带他走出舒适区，去试试他不敢做的事。",gifts:"咖啡、腌菜、松露油、葡萄酒"},
    en:{name:"Harvey",title:"The careful doctor",desc:"The town's only doctor. Gentle, attentive, a little timid, and worried about everyone's health.",home:"The small apartment above the clinic",routine:"Checkups on Tuesdays and Thursdays. Other days: the front desk in the morning, walks around town in the afternoon. Saturdays: the museum. Rainy evenings: the Saloon.",hobby:"Reading, radios, model planes, jazz, dance aerobics",events:[["2♥","He argues with George about his health; you pick a side"],["4♥","He checks your pulse at the clinic"],["6♥","You catch him at a secret aerobics class"],["8♥","He reaches a real pilot on his radio and shares his dream of flying"],["10♥","A hot-air balloon ride together"],["14♥","He cooks you dinner and does the dishes"]],why:"He'll take good care of you, and you can coax him out of his comfort zone.",gifts:"Coffee, pickles, truffle oil, wine"}},
  sam:{spouse:"M",color:"#f0c23b",icon:"note",bd:["su",17],mbti:"ENTP",mbtiSrc:"pt",p:{soc:2,art:2,sci:-1,adv:1,nat:-1,care:1,edge:1,amb:0,home:0},
    zh:{name:"山姆",title:"滑板乐队主唱",desc:"金色刺猬头，玩滑板、组乐队，永远很有精神，也会照顾弟弟文森特。",home:"柳树巷1号，和妈妈乔迪、弟弟文森特同住",routine:"周一、周三在Joja超市打工，大多数日子在房间练吉他，周五和周末在酒吧打台球。",hobby:"吉他、滑板、掌机、台球",events:[["2心","和塞巴斯蒂安排练，你帮乐队选风格"],["4心","他打碎了鸡蛋，你帮他跟妈妈解释"],["6心","在花坛上玩滑板被镇长抓到"],["8心","邀你去祖祖城看乐队演出"],["10心","在房间向你告白，差点被妈妈撞见"],["14心","接了一个儿童节目的配乐工作"]],why:"跟他在一起每天都很热闹，你们可以一起排练、一起搞点小破坏。",gifts:"披萨、枫糖棒、仙人掌果、虎眼石"},
    en:{name:"Sam",title:"The skateboarding frontman",desc:"Spiky blond hair, a skateboard and a band. Always full of energy, and a good big brother to Vincent.",home:"1 Willow Lane, with his mum Jodi and brother Vincent",routine:"Works at JojaMart on Mondays and Wednesdays, practises guitar in his room most days, and plays pool at the Saloon on Fridays and weekends.",hobby:"Guitar, skateboarding, handheld games, pool",events:[["2♥","Jam with Sebastian and help pick the band's style"],["4♥","He drops an egg; you explain it to his mum"],["6♥","Lewis catches him skating on a flower box"],["8♥","He invites you to his band's show in Zuzu City"],["10♥","A confession in his room, nearly caught by his mum"],["14♥","He lands a job writing music for a kids' TV show"]],why:"Life with him is never quiet. You can rehearse together and get into a little mischief.",gifts:"Pizza, maple bar, cactus fruit, tiger's eye"}},
  sebastian:{spouse:"M",color:"#3b3f5c",icon:"monitor",bd:["wi",10],mbti:"INTJ",mbtiSrc:"pt",p:{soc:-2,art:0,sci:2,adv:1,nat:0,care:-1,edge:2,amb:0,home:-1},
    zh:{name:"塞巴斯蒂安",title:"地下室程序员",desc:"不爱社交，喜欢下雨天，觉得家里人不理解他的工作，一直想离开小镇。",home:"山路24号，母亲罗宾的木匠铺地下室",routine:"睡到十点半，然后对着电脑工作；晚上在家旁边的湖边待着。周五、周六和山姆去酒吧打台球，雨天去海边码头。",hobby:"自由职业编程、电脑游戏和桌游、漫画、科幻小说、骑摩托、台球、青蛙",events:[["2心","聊自己做自由职业程序员不被理解"],["4心","在修摩托，说以后带你兜风"],["6心","和山姆一起在他房间玩桌游"],["8心","雨天海边，承认自己在人群里会焦虑，和你共撑一把伞"],["10心","骑摩托带你去看风景，向你告白"],["14心","雨天一起救了一只受伤的青蛙"]],why:"他不需要很多人，只需要一个真正懂他的人，在雨天陪他坐在码头。",gifts:"冰封泪珠、黑曜石、生鱼片、南瓜汤"},
    en:{name:"Sebastian",title:"The programmer in the basement",desc:"Not one for crowds, loves rainy days, feels his family doesn't get his work, and has long wanted to leave town.",home:"24 Mountain Road, in the basement of his mother Robin's carpenter shop",routine:"Sleeps until 10:30, then works at his computer; evenings by the lake next to the house. Fridays and Saturdays: pool with Sam at the Saloon. Rainy days: the beach pier.",hobby:"Freelance programming, computer and tabletop games, comics, sci-fi novels, his motorcycle, pool, frogs",events:[["2♥","He talks about freelancing and feeling unappreciated"],["4♥","Working on his motorcycle, he promises you a ride"],["6♥","A tabletop game with him and Sam in his room"],["8♥","On a rainy beach he admits crowds make him anxious and shares his umbrella"],["10♥","A motorcycle ride to a viewpoint and a confession"],["14♥","Rescue an injured frog together in the rain"]],why:"He doesn't need a lot of people, just one who really gets him and will sit on the pier with him in the rain.",gifts:"Frozen tear, obsidian, sashimi, pumpkin soup"}},
  shane:{spouse:"M",color:"#5d6b8a",icon:"egg",bd:["sp",20],mbti:"ISTP",mbtiSrc:"pt",p:{soc:-2,art:-1,sci:-1,adv:-1,nat:1,care:1,edge:1,amb:-2,home:1},
    zh:{name:"谢恩",title:"外冷内热的养鸡人",desc:"一开始对谁都冷冰冰，熟悉后会发现他很疼教女贾斯，也特别会养鸡。",home:"玛妮牧场，和姨妈玛妮、教女贾斯同住",routine:"工作日早九晚五在Joja超市上班，大多数晚上在酒吧，周末常在牧场附近。",hobby:"打游戏、橄榄球（高中打过校队）、看电视、养鸡",events:[["6心","雨天在森林悬崖边找到他，他说出心里的低谷"],["7心","少喝了酒，攒钱给贾斯买了双好鞋"],["8心","在牧场的秘密房间里给你看他养的蓝色小鸡"],["10心","带你去祖祖城看球赛"],["14心","告诉你他用打游戏代替喝酒"]],why:"他需要时间才能敞开心扉，而你恰好愿意给他这个时间。",gifts:"辣椒、胡椒爆米花、披萨"},
    en:{name:"Shane",title:"The gruff chicken keeper",desc:"Cold to everyone at first. Once you know him, you'll find he dotes on his goddaughter Jas and is brilliant with chickens.",home:"Marnie's Ranch, with his aunt Marnie and goddaughter Jas",routine:"Works at JojaMart 9 to 5 on weekdays, spends most evenings at the Saloon, and stays near the ranch at weekends.",hobby:"Video games, gridball (he played varsity), TV, raising chickens",events:[["6♥","On a rainy day at the forest cliffs, he opens up about how low he's been"],["7♥","Cutting back on drinking, he buys Jas a good pair of shoes"],["8♥","He shows you his blue chickens in a hidden room at the ranch"],["10♥","A gridball game together in Zuzu City"],["14♥","He tells you video games help him stay off the drink"]],why:"He needs time to open up, and you're willing to give it to him.",gifts:"Hot pepper, pepper poppers, pizza"}},

  robin:{spouse:null,color:"#c76a3a",icon:"hammer",bd:["fa",21],mbti:"ESTJ",mbtiSrc:"own",p:{soc:1,art:1,sci:0,adv:0,nat:1,care:1,edge:0,amb:2,home:1},
    zh:{name:"罗宾",title:"山里的木匠",desc:"镇上的木匠，帮全镇盖房子，热情、能干、闲不下来，是一家人的主心骨。",home:"山路24号木匠铺，和丈夫德米特里厄斯、女儿玛鲁、儿子塞巴斯蒂安同住",routine:"早上六点起床，八点开店，下午五点去山上走走，九点睡觉。周二不开店去上健身课，周五和德米特里厄斯去酒吧跳舞。",hobby:"木工、健身课",events:[["6心","送你鼓块和长笛块的图纸"],["任务","帮她找回丢失的斧头"]],gifts:"山羊奶酪、桃子、意大利面"},
    en:{name:"Robin",title:"The carpenter on the mountain",desc:"The town carpenter who builds everyone's houses. Warm, capable, always busy, and the anchor of her family.",home:"The Carpenter's Shop at 24 Mountain Road, with Demetrius, Maru and Sebastian",routine:"Up at 6, shop open from 8, a walk on the mountain at 5, bed at 9. Tuesdays: no shop, exercise class. Fridays: dancing with Demetrius at the Saloon.",hobby:"Woodworking, exercise class",events:[["6♥","She gives you blueprints for the drum and flute blocks"],["Quest","Find her lost axe"]],gifts:"Goat cheese, peach, spaghetti"}},
  demetrius:{spouse:null,color:"#4f7a6a",icon:"flask",bd:["su",19],mbti:"ISTJ",mbtiSrc:"gr",p:{soc:0,art:-1,sci:2,adv:0,nat:2,care:0,edge:-1,amb:1,home:1},
    zh:{name:"德米特里厄斯",title:"山间科学家",desc:"在家里的实验室研究山谷的动植物，理性、严谨，偶尔有点过度保护家人。",home:"山路24号，和妻子罗宾、女儿玛鲁、继子塞巴斯蒂安同住",routine:"上午十一点左右在显微镜前工作，雨天上午看报纸，周五和罗宾去酒吧跳舞。",hobby:"研究本地动植物，秋天研究真菌，对恐龙蛋这类稀有样本着迷",events:[["6心","和罗宾争论番茄是水果还是蔬菜，你来判"],["剧情","请你帮忙研究农场边的山洞"]],gifts:"豆子火锅、冰淇淋、大米布丁、草莓"},
    en:{name:"Demetrius",title:"The mountain scientist",desc:"Studies the valley's plants and wildlife in his home lab. Rational and precise, and sometimes a bit overprotective.",home:"24 Mountain Road, with Robin, Maru and his stepson Sebastian",routine:"At his microscope around 11 AM, reads the paper on rainy mornings, dances with Robin at the Saloon on Fridays.",hobby:"Local wildlife research, fungi in the fall, rare specimens like dinosaur eggs",events:[["6♥","Robin and he argue over whether tomatoes are fruit; you decide"],["Story","He asks for help researching the cave on your farm"]],gifts:"Bean hotpot, ice cream, rice pudding, strawberry"}},
  linus:{spouse:null,color:"#7a6a4a",icon:"tent",bd:["wi",3],mbti:"INFJ",mbtiSrc:"gr",p:{soc:-2,art:0,sci:0,adv:1,nat:2,care:1,edge:1,amb:-2,home:-1},
    zh:{name:"莱纳斯",title:"帐篷里的隐士",desc:"一个人住在山上，靠野外生存过日子。常被镇上的人误解，但对自然和朋友都很真诚。",home:"矿洞西边山上的小帐篷",routine:"白天多在帐篷前的篝火旁，春夏去湖边，秋天上午、冬天下午去温泉。",hobby:"采集、钓鱼、读书、亲近自然",events:[["0心","撞见他翻乔治家的垃圾桶找吃的，格斯后来请他吃饭"],["4心","请你进帐篷，教你做野生鱼饵"],["8心","婉拒搬到农场，更想要独立的生活"]],gifts:"蓝莓挞、仙人掌果、椰子、山药"},
    en:{name:"Linus",title:"The hermit in the tent",desc:"Lives alone on the mountain, living off the land. Often misunderstood by the town, but sincere with nature and his friends.",home:"A small tent on the mountain, west of the mines",routine:"Mostly by the campfire outside his tent. The lake in spring and summer, the spa on fall mornings and winter afternoons.",hobby:"Foraging, fishing, reading, living close to nature",events:[["0♥","You catch him going through George's bins; Gus later feeds him"],["4♥","He invites you into his tent and teaches you wild bait"],["8♥","He turns down moving to the farm to keep his independence"]],gifts:"Blueberry tart, cactus fruit, coconut, yam"}},
  willy:{spouse:null,color:"#3d6f8f",icon:"fish",bd:["su",24],mbti:"ISTP",mbtiSrc:"own",p:{soc:0,art:0,sci:0,adv:1,nat:2,care:0,edge:0,amb:-1,home:0},
    zh:{name:"威利",title:"老渔夫",desc:"在蕨类群岛的船上长大，最爱的是大海和钓竿，讲起鱼来没完没了。",home:"海滩上的鱼店，和艾利欧特是海滩仅有的两位居民",routine:"一大早在店外钓鱼，白天看店，晚上常去酒吧，冬天和克林特坐一桌。周六关店去钓鱼。",hobby:"钓鱼、烟斗、读钓鱼和抓蟹的书、做祖传龙虾浓汤",events:[["6心","螃蟹占领了鱼店，格斯全部买下做蟹饼"],["节日","鳟鱼大赛和鱿鱼节都能看到他钓鱼"]],gifts:"鲶鱼、章鱼、鲟鱼、海参"},
    en:{name:"Willy",title:"The old fisherman",desc:"Grew up sailing around the Fern Islands. Loves the sea and his rod above all, and can talk about fish all day.",home:"The Fish Shop on the beach; he and Elliott are its only residents",routine:"Fishes outside the shop at dawn, minds the counter by day, often at the Saloon in the evening (sitting with Clint in winter). Closes on Saturdays to go fishing.",hobby:"Fishing, his pipe, fishing and crabbing books, his family lobster bisque",events:[["6♥","Crabs overrun the shop; Gus buys them all for crab cakes"],["Festival","You'll find him fishing at the Trout Derby and SquidFest"]],gifts:"Catfish, octopus, sturgeon, sea cucumber"}},
  wizard:{spouse:null,color:"#5b3f8a",icon:"star",bd:["wi",17],mbti:"INTP",mbtiSrc:"gr",p:{soc:-2,art:1,sci:2,adv:1,nat:1,care:-1,edge:1,amb:1,home:-1},
    zh:{name:"法师",title:"塔里的神秘法师",desc:"全名拉斯莫迪斯。研究灵界，懂多种元素语言，暗中观察村民，想找一个学徒。",home:"煤矿森林最西边的法师塔",routine:"几乎一直待在塔里，暴风雨时会和元素精灵交流。",hobby:"研究灵界和元素魔法",events:[["4心","开放地下室，你可以在幻象神殿改变外貌"],["6心","说起自己很久以前的一段婚姻"]],gifts:"紫蘑菇、太阳精华、超级黄瓜、虚空精华"},
    en:{name:"Wizard",title:"The mysterious wizard in the tower",desc:"M. Rasmodius. Studies the spirit world, speaks elemental languages, watches the villagers in secret, and hopes to find an apprentice.",home:"The Wizard's Tower, at the far west of Cindersap Forest",routine:"Almost always in his tower. During storms he communes with the elementals.",hobby:"The spirit world and elemental magic",events:[["4♥","He opens his basement: change your look at the Shrine of Illusions"],["6♥","He tells you about a marriage long ago"]],gifts:"Purple mushroom, solar essence, super cucumber, void essence"}},
  krobus:{spouse:null,color:"#2f2f3f",icon:"moon",bd:["wi",1],mbti:"ISFJ",mbtiSrc:"own",p:{soc:-1,art:0,sci:0,adv:0,nat:0,care:2,edge:1,amb:-1,home:2},
    zh:{name:"科罗布斯",title:"下水道里的温柔影人",desc:"游戏里唯一友善的怪物，卖稀有物品，把其他怪物都当朋友，可以成为你的室友。",home:"下水道",routine:"不能晒太阳，白天一直待在下水道。周五保持沉默，表示对尤巴的尊敬。",hobby:"经营小店，收集虚空系的东西",events:[["任务","黑暗护符任务和他有关"],["室友","可以邀请他搬到农场当室友"]],gifts:"钻石、铱锭、南瓜、虚空蛋、野山葵"},
    en:{name:"Krobus",title:"The gentle shadow in the sewers",desc:"The only friendly monster you'll meet. Sells rare goods, counts other monsters as friends, and can become your roommate.",home:"The sewers",routine:"Can't go out in sunlight, so he stays in the sewers by day. Keeps silent on Fridays out of respect for Yoba.",hobby:"Running his shop, collecting all things void",events:[["Quest","He's part of the Dark Talisman quest"],["Roommate","He can move to your farm as a roommate"]],gifts:"Diamond, iridium bar, pumpkin, void egg, wild horseradish"}},
  lewis:{spouse:null,color:"#7a5a3a",icon:"house",bd:["sp",7],mbti:"ESTJ",mbtiSrc:"own",p:{soc:2,art:-1,sci:0,adv:-1,nat:0,care:1,edge:-1,amb:1,home:2},
    zh:{name:"刘易斯",title:"操心的镇长",desc:"当了二十多年镇长，组织每个节日、关心每户人家，也很在意小镇的名声。",home:"镇长府邸，门口有特别订单公告板",routine:"每晚来收出货箱里的东西，周三早餐吃荞麦华夫饼配咖啡，大约一周去一次酒吧。",hobby:"园艺",events:[["任务","帮他找回丢失的紫色短裤"],["3心","撞见他和玛妮的秘密恋情，你决定要不要保密"]],gifts:"秋日恩赐、蜜汁山药、绿茶、辣椒"},
    en:{name:"Lewis",title:"The fretting mayor",desc:"Mayor for over twenty years. Organises every festival, looks out for every household, and cares a great deal about the town's reputation.",home:"The Mayor's Manor, with the Special Orders board out front",routine:"Collects the shipping bin every night, has buckwheat waffles and coffee on Wednesdays, and visits the Saloon about once a week.",hobby:"Gardening",events:[["Quest","Find his lost purple shorts"],["3♥","Overhear his secret romance with Marnie; keep it quiet or not"]],gifts:"Autumn's bounty, glazed yams, green tea, hot pepper"}},
  marnie:{spouse:null,color:"#b5743a",icon:"bucket",bd:["fa",18],mbti:"ESFJ",mbtiSrc:"own",p:{soc:1,art:0,sci:-1,adv:-1,nat:2,care:2,edge:-1,amb:0,home:2},
    zh:{name:"玛妮",title:"牧场大姐",desc:"经营牧场，卖动物和饲料，照顾外甥谢恩和外甥女贾斯。温暖、实在、爱动物。",home:"玛妮牧场，和谢恩、贾斯同住",routine:"上午九点到下午四点开店（周一、周二休息），五点去酒吧，十一点回家。周二上健身课。",hobby:"养动物、做饭",events:[["3心","请你给她的山羊带一根洞穴胡萝卜"],["6心","撞见她和镇长约会，你决定要不要保密"]],gifts:"钻石、农夫午餐、粉红蛋糕、南瓜派"},
    en:{name:"Marnie",title:"The ranch auntie",desc:"Runs the ranch, sells animals and supplies, and looks after her nephew Shane and niece Jas. Warm, down to earth and animal-mad.",home:"Marnie's Ranch, with Shane and Jas",routine:"Shop open 9 to 4 (closed Mondays and Tuesdays), the Saloon from 5, home by 11. Tuesday exercise class.",hobby:"Animals, cooking",events:[["3♥","She asks for a cave carrot for her goats"],["6♥","Catch her on a date with the mayor; keep it secret or not"]],gifts:"Diamond, farmer's lunch, pink cake, pumpkin pie"}},
  gus:{spouse:null,color:"#a0522d",icon:"pot",bd:["su",8],mbti:"ENFJ",mbtiSrc:"gr",p:{soc:2,art:1,sci:0,adv:0,nat:0,care:2,edge:-1,amb:0,home:1},
    zh:{name:"格斯",title:"酒吧大厨",desc:"星之果实酒吧的老板兼厨师，雇艾米丽兼职，几乎全镇的人晚上都会来他这里。",home:"就住在星之果实酒吧",routine:"营业时间一直在吧台后面。",hobby:"做饭，喜欢给人寄食谱",events:[["4心","潘姆一直欠账，他担心酒吧经营不下去"],["3心起","开始给你寄食谱"]],gifts:"鱼塔可、焗蜗牛、橙子、钻石"},

function emblemCanvas(id, scale){

  cv.width=cv.height=n*scale; const g=cv.getContext("2d");

/* =============== 音乐与音效（原创旋律） =============== */
let AC=null, musicTimer=null, nextT=0, step=0;
const N = (n)=>440*Math.pow(2,(n-69)/12);
const nm = {C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79,A5:81,G3:55,A3:57,B3:59,C3:48,D3:50,E3:52,F3:53,G2:43};
// 每项 [音, 拍]；一拍 = 一个四分音符
const MEL = [["G4",1],["B4",.5],["D5",.5],["E5",1],["D5",1],["B4",1],["A4",.5],["G4",.5],["A4",2],["G4",1],["B4",.5],["D5",.5],["G5",1],["E5",1],["D5",1.5],["B4",.5],["D5",2],
             ["E5",1],["D5",.5],["B4",.5],["C5",1],["A4",1],["B4",1],["G4",.5],["E4",.5],["D4",2],["E4",1],["G4",.5],["A4",.5],["B4",1],["D5",1],["A4",1.5],["B4",.5],["G4",2]];
const BASS = ["G2","D3","G2","D3","C3","G2","C3","D3"];
function tone(freq, t, dur, type, vol){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
const BEAT = 60/96;
let melTimes=null;
function scheduleMusic(){
  if(!melTimes){ melTimes=[]; let b=0; MEL.forEach(m=>{melTimes.push(b); b+=m[1];}); melTimes.total=b; }
  while(nextT < AC.currentTime + 0.4){
    const loopStart = nextT; const total=melTimes.total;
    MEL.forEach((m,i)=>{ const t=loopStart+melTimes[i]*BEAT; tone(N(nm[m[0]]),t,m[1]*BEAT*.9,"triangle",.07); });
    for(let bar=0;bar<total/4;bar++){ const root=nm[BASS[bar%BASS.length]];
      for(let q=0;q<4;q++){ const t=loopStart+(bar*4+q)*BEAT; tone(N(root+(q%2?7:0)),t,BEAT*.6,"square",.018); } }
    nextT = loopStart + total*BEAT;
  }
}
function startMusic(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){ return; }
  nextT = AC.currentTime + .1; melTimes=null; scheduleMusic();
  musicTimer = setInterval(()=>{ if(AC.currentTime > nextT - 1) scheduleMusic(); }, 300);
}
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; if(AC){ AC.close(); AC=null; } }
function sfx(kind){
  if(!S.sound || !AC) return; const t=AC.currentTime;
  if(kind==="pick"){ tone(880,t,.06,"square",.04); tone(1320,t+.05,.07,"square",.035); }
  if(kind==="hit"){ tone(110,t,.12,"square",.08); tone(70,t+.02,.15,"triangle",.08); }
  if(kind==="crack"){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.07,.2,"triangle",.07)); }
  if(kind==="season"){ [392,494,587,784].forEach((f,i)=>tone(f,t+i*.1,.25,"triangle",.06)); }
}

function zero(keys){const v={};keys.forEach(k=>v[k]=0);return v}
function addInto(a,b,w=1){for(const k in b)if(k in a)a[k]+=(b[k]||0)*w;return a}
function cosv(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return (na&&nb)?d/Math.sqrt(na*nb):0}
function pct(c){return Math.max(1,Math.min(99,Math.round(50+49*c)))}
function mbtiVec(t){return [t[0]==="E"?1:-1,t[1]==="N"?1:-1,t[2]==="F"?1:-1,t[3]==="P"?1:-1]}
const MBTI_W = 1.3;
const NORM = (()=>{
  const tm=zero(TRAIT_KEYS), tv=zero(TRAIT_KEYS), am=zero(AXES), av=zero(AXES), pm=zero(TRAIT_KEYS);
  QUESTIONS.forEach(Q=>{
    const n=Q.o.length;
    TRAIT_KEYS.forEach(k=>{ const vals=Q.o.map(o=>o[2][k]||0), m=vals.reduce((a,b)=>a+b,0)/n;
      if(Q.pref) pm[k]+=m; else { tm[k]+=m; tv[k]+=vals.reduce((a,b)=>a+(b-m)**2,0)/n; } });
    if(!Q.pref) AXES.forEach(k=>{ const vals=Q.o.map(o=>o[3][k]||0), m=vals.reduce((a,b)=>a+b,0)/n;
      am[k]+=m; av[k]+=vals.reduce((a,b)=>a+(b-m)**2,0)/n; });
  });
  const ids=Object.keys(CHARS), cmean=zero(TRAIT_KEYS);
  ids.forEach(id=>addInto(cmean,CHARS[id].p,1/ids.length));
  const cvec={}, ctrait={};
  ids.forEach(id=>{ const t=TRAIT_KEYS.map(k=>(CHARS[id].p[k]||0)-cmean[k]); ctrait[id]=t; cvec[id]=t.concat(mbtiVec(CHARS[id].mbti).map(x=>x*MBTI_W)); });
  return {tm,tsd:Object.fromEntries(TRAIT_KEYS.map(k=>[k,Math.sqrt(tv[k])||1])),am,asd:Object.fromEntries(AXES.map(k=>[k,Math.sqrt(av[k])||1])),pm,cvec,ctrait};
})();
function compute(ans,g){
  const traw=zero(TRAIT_KEYS), araw=zero(AXES), praw=zero(TRAIT_KEYS);
  QUESTIONS.forEach((Q,i)=>{ const o=Q.o[ans[i]]; if(!o) return; if(Q.pref) addInto(praw,o[2]); else { addInto(traw,o[2]); addInto(araw,o[3]); } });
  const tz=TRAIT_KEYS.map(k=>(traw[k]-NORM.tm[k])/NORM.tsd[k]);
  const az=AXES.map(k=>(araw[k]-NORM.am[k])/NORM.asd[k]);
  const type=az.map((v,i)=>v>=0?"ENFP"[i]:"ISTJ"[i]).join("");
  const user=tz.concat(az.map(v=>v*MBTI_W));
  const pref=TRAIT_KEYS.map(k=>praw[k]-NORM.pm[k]);
  const ranked=Object.keys(CHARS).map(id=>({id,s:cosv(user,NORM.cvec[id])})).sort((a,b)=>b.s-a.s);
  const me=ranked[0];
  const spouses=Object.keys(CHARS).filter(id=>CHARS[id].spouse && id!==me.id && (g==="any"||CHARS[id].spouse===g))
    .map(id=>({id,s:0.75*cosv(user,NORM.cvec[id])+0.25*cosv(pref,NORM.ctrait[id])})).sort((a,b)=>b.s-a.s);
  return {tz,az,type,ranked,me,spouses};
}
function sharedTraits(tz,cv){
  return TRAIT_KEYS.map((k,i)=>({k,u:tz[i],c:cv[i]})).filter(x=>x.u>0.3&&x.c>0.3).sort((a,b)=>b.u*b.c-a.u*a.c).slice(0,3).map(x=>T().traits[x.k]);
}
function letterMatch(a,b){let n=0;for(let i=0;i<4;i++)if(a[i]===b[i])n++;return n}
function bdText(bd){ const t=T(); return S.lang==="zh" ? t.seasons[bd[0]]+bd[1]+"日" : t.seasons[bd[0]]+" "+bd[1]; }

/* =============== 雷达 =============== */
function radar(userZ, charP, color){
  const n=TRAIT_KEYS.length, cx=170, cy=155, R=105;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]};
  const uv=userZ.map(z=>Math.max(.06,Math.min(1,(z+2.2)/4.4)));
  const cv=TRAIT_KEYS.map(k=>Math.max(.06,((charP[k]||0)+2)/4));
  let g="";
  [.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${TRAIT_KEYS.map((_,i)=>pt(i,R*f).map(Math.round).join(",")).join(" ")}" fill="none" stroke="#d9b98a" stroke-width="2"/>`});
  TRAIT_KEYS.forEach((k,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${Math.round(x)}" y2="${Math.round(y)}" stroke="#d9b98a" stroke-width="2"/>`;
    const [lx,ly]=pt(i,R+24);g+=`<text x="${Math.round(lx)}" y="${Math.round(ly)+6}" text-anchor="middle" font-size="${S.lang==="zh"?14:11}" fill="#5c3416">${esc(T().traits[k])}</text>`});
  const poly=(v,col,dash)=>`<polygon points="${v.map((r,i)=>pt(i,R*r).map(Math.round).join(",")).join(" ")}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="3" stroke-linejoin="miter" ${dash?'stroke-dasharray="6 4"':""}/>`;
  g+=poly(cv,color,true); g+=poly(uv,"#e2574c",false);
  uv.forEach((r,i)=>{const [x,y]=pt(i,R*r);g+=`<rect x="${Math.round(x)-4}" y="${Math.round(y)-4}" width="8" height="8" fill="#e2574c"/>`});
  return `<svg viewBox="0 0 340 310" width="100%" style="max-width:400px" shape-rendering="crispEdges" role="img">${g}</svg>`;
}

/* =============== 星露谷身份证 =============== */
function pixelate(img){
  const n=44, s=Math.min(img.width,img.height), sx=(img.width-s)/2, sy=(img.height-s)/2*0.6;
  const c=document.createElement("canvas"); c.width=c.height=n; const g=c.getContext("2d");
  g.imageSmoothingEnabled=true; g.drawImage(img,sx,sy,s,s,0,0,n,n);
  const d=g.getImageData(0,0,n,n), a=d.data, lv=6;
  for(let i=0;i<a.length;i+=4){
    let r=a[i],gg=a[i+1],b=a[i+2]; const m=(r+gg+b)/3;
    r=m+(r-m)*1.25; gg=m+(gg-m)*1.25; b=m+(b-m)*1.25; // 稍微提高饱和度
    const q=v=>Math.max(0,Math.min(255,Math.round(v/255*(lv-1))*(255/(lv-1))));
    a[i]=q(r*1.04+6); a[i+1]=q(gg*1.0+4); a[i+2]=q(b*0.94);
  }
  g.putImageData(d,0,0); return c;
}
function idNumber(){
  const str=(S.farmer.name||"")+S.result.me.id+S.result.type+(S.farmer.farm||"");
  let h=7; for(const ch of str) h=(h*31+ch.codePointAt(0))%1000000;
  return "PT-"+String(h).padStart(6,"0");
}
async function makeCard(quiet){

  const W2=720, H2=440, cv=document.createElement("canvas"); cv.width=W2; cv.height=H2; const g=cv.getContext("2d");
  g.imageSmoothingEnabled=false;
  const px=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  // 木框
  px(0,0,W2,H2,"#5c3416"); px(6,6,W2-12,H2-12,"#c9853e"); px(12,12,W2-24,H2-24,"#8a5528"); px(18,18,W2-36,H2-36,"#fbe6b5");
  [[0,0],[W2-6,0],[0,H2-6],[W2-6,H2-6]].forEach(([x,y])=>px(x,y,6,6,"rgba(0,0,0,0)"));
  // 表头
  const L=SEASON_LOOK.sp; px(18,18,W2-36,44,CHARS[id].color);
  for(let x=18;x<W2-18;x+=12) px(x,58,6,4,"rgba(0,0,0,.18)");
  g.fillStyle="#fff8e6"; g.font='20px "FusionPixel", monospace'; g.textBaseline="middle"; g.fillText(tc.head,34,41);
  g.textAlign="right"; g.fillText(idNumber(),W2-34,41); g.textAlign="left";
  // 照片
  const PX=40, PY=84, PS=176;
  px(PX-6,PY-6,PS+12,PS+12,"#5c3416"); px(PX-2,PY-2,PS+4,PS+4,"#e9c48a");
  if(S.photo){ g.drawImage(S.photo,PX,PY,PS,PS); } else { g.drawImage(emblemCanvas(id,11),PX,PY,PS,PS); }
  // 小鸡和居民徽章
  g.drawImage(emblemCanvas(id,3),PX+PS-36,PY+PS-36,48,48);
  // 文字
  const name=S.farmer.name||t.phName, farm=(S.farmer.farm||t.phFarm)+(S.lang==="zh"?t.farmSuffix:" "+t.farmSuffix), fav=S.farmer.fav||t.phFav;
  const rows=[[tc.name,name],[tc.farm,farm],[tc.fav,fav],[tc.like,C(id).name+(S.lang==="zh"?"（"+C(id).title+"）":"")],[tc.mbti,R.type],[tc.love,C(best.id).name+" ♥ "+pct(best.s)+"%"],[tc.since,tc.sinceV]];
  let y=96; const LX=250, VX=S.lang==="zh"?330:372;
  rows.forEach(([k,v])=>{ g.fillStyle="#8a5528"; g.font='18px "FusionPixel", monospace'; g.fillText(k,LX,y);
    g.fillStyle="#3b2412"; g.font='22px "FusionPixel", monospace'; let vv=v; while(g.measureText(vv).width>W2-VX-40 && vv.length>2) vv=vv.slice(0,-2)+"…"; g.fillText(vv,VX,y);
    px(LX,y+14,W2-LX-40,2,"#e9c48a"); y+=34; });
  // 性格条
  const tops=TRAIT_KEYS.map((k,i)=>({k,z:R.tz[i]})).sort((a,b)=>b.z-a.z).slice(0,3);
  tops.forEach(({k,z},i)=>{ const yy=296+i*38; g.fillStyle="#8a5528"; g.font='16px "FusionPixel", monospace'; g.fillText(t.traits[k],40,yy);
    const w=Math.round(Math.max(.1,Math.min(1,(z+2.2)/4.4))*10); for(let j=0;j<10;j++) px(40+j*16,yy+12,12,12,j<w?"#e2574c":"#e9c48a"); });
  // 农场小景
  const cropImg=spriteCanvas(CROPS.plant,CROP_PAL,4);
  for(let i=0;i<6;i++) g.drawImage(cropImg,LX+i*36,H2-74);
  g.drawImage(spriteCanvas(CHICK[0],CHICK_PAL,4),W2-110,H2-90);
  // 页脚
  g.fillStyle="#8a5528"; g.font='14px "FusionPixel", monospace'; g.textAlign="right"; g.fillText(tc.foot,W2-34,H2-30); g.textAlign="left";

  const url=cv.toDataURL("image/png");
  const out=document.getElementById("cardOut");
  out.innerHTML=`<img class="idimg" src="${url}" alt="${esc(t.idT)}"><div class="actions" id="saveRow"></div><p class="note" id="saveNote">${esc(t.idLongPress)}</p>`;
  const row=document.getElementById("saveRow");

    // 独立部署时（不在 claude.ai 里），用普通的下载链接

  } else {
    row.innerHTML=`<button class="btn" id="saveId">${esc(t.idSave)}</button>`;
    document.getElementById("saveId").onclick=()=>{
      cv.toBlob(async b=>{ try{ await dl.save({filename:"stardew-id.png",data:b}); document.getElementById("saveNote").textContent=t.idSaved; }
        catch(e){ if(!e||e.code!=="declined") document.getElementById("saveNote").textContent=t.idSaveFail; } },"image/png");
    };
  }
  if(!quiet) out.scrollIntoView({behavior:"smooth",block:"center"});
}
let _dl;
function getDownloads(){
  if(_dl!==undefined) return Promise.resolve(_dl);
  if(!window.claude||!window.claude.use) return Promise.resolve(_dl=null);
  return Promise.race([window.claude.use("downloads"), new Promise(r=>setTimeout(()=>r(null),3000))]).then(d=>(_dl=d||null)).catch(()=>(_dl=null));
}
